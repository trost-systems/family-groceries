# Every word the store files show besides the app's own (docs/STORE_SCREENSHOTS.md, job 215).
#
#   <locale>:
#     shots:               one entry per shot id of sets.mjs, here in store order
#       <id>:
#         status:          draft | approved (approved only after Peter and Legal)
#         h: [line 1, line 2]   the headline, always two lines
#         s:               the subline
#         alt:             the store's alt text, at most 140 characters
#         sticker:         words drawn on the shot's sticker (voice: the spoken sentence; assist:
#                          the request, the reply and the items the assistant adds)
#         variants:        voice and assist only: neutral (the default), named, named_api. A
#                          variant replaces s and alt, and may replace them per store (play:).
#     feature: { status, tagline, alt }    the Play feature graphic
#
# The words a sticker shows are what the capture really sends: the voice sentence goes to the
# local voice function, the assist items to the local mcp function.
# Siri, Alexa, MCP and API may appear only in a named variant; API only in named_api, which no
# default run uses: the API is switched off (flag public-api) and is not announced. Named variants
# wait for Legal; Alexa waits for the skill's certification (docs/store/store-captions-assistants.md).

de-DE:
  shots:
    list:
      status: draft
      h: [Eine Liste., Für alle.]
      s: Für Partner, Familie oder WG. Ohne Werbung.
      alt: Gemeinsame Einkaufsliste nach Läden; zwei neue Einträge von Anna sind gelb markiert.
    sync:
      status: draft
      h: [Du schreibst., Anna sieht’s.]
      s: Sofort bei allen auf der Liste.
      alt: Jonas trägt Kaffee ein, und auf Annas Liste erscheint er sofort gelb markiert im Supermarkt.
    add:
      status: draft
      h: ["Kurz getippt,", "schon drauf."]
      s: Mit Menge und Vorschlägen aus euren Einkäufen.
      alt: Beim Tippen von „3 Jogh“ schlägt Snacklist „Joghurt · 3“ aus früheren Einkäufen vor.
    order:
      status: draft
      h: ["Dein Laden,", "dein Weg."]
      s: Halten und ziehen. Jeder Laden hat seine Reihenfolge.
      alt: Die Kategorien im Supermarkt werden per Halten und Ziehen in die eigene Reihenfolge gebracht.
    voice:
      status: draft
      h: ["Gesagt,", "notiert."]
      sticker:
        said: Bananen, Butter und Haferflocken
      variants:
        neutral:
          s: Per Sprachassistent auf die Liste.
          alt: Jonas sagt „Bananen, Butter und Haferflocken“, und auf Annas Liste erscheinen die drei gelb markiert.
        named:
          s: Funktioniert mit Siri und Amazon Alexa.
          alt: Jonas sagt Siri „Bananen, Butter und Haferflocken“, und auf Annas Liste erscheinen die drei gelb markiert.
          play:
            s: Funktioniert mit Amazon Alexa.
            alt: Jonas sagt Alexa „Bananen, Butter und Haferflocken“, und auf Annas Liste erscheinen die drei gelb markiert.
    assist:
      status: draft
      h: [Läuft auch, von selbst.]
      sticker:
        ask: Wir machen Apfelpfannkuchen. Setz die Zutaten auf unsere Liste.
        reply: Steht auf eurer Liste
        items: [Äpfel, Eier, Mehl]
      variants:
        neutral:
          s: KI-Assistenten schreiben mit.
          alt: Ein KI-Assistent setzt Äpfel, Eier und Mehl auf die Liste; bei Anna erscheinen sie sofort gelb markiert.
        named:
          s: Verbinde deinen KI-Assistenten über MCP.
          alt: Ein KI-Assistent setzt über MCP Äpfel, Eier und Mehl auf die Liste; bei Anna erscheinen sie sofort gelb markiert.
        named_api:
          s: MCP für KI, API für Automationen.
          alt: Ein KI-Assistent setzt über MCP Äpfel, Eier und Mehl auf die Liste; bei Anna erscheinen sie sofort gelb markiert.
    invite:
      status: draft
      h: [Alle dabei., Viele Listen.]
      s: Ladet alle ein und legt so viele Listen an, wie ihr braucht.
      alt: Haushaltsseite mit Anna und Jonas, „Leute einladen“ und den Listen Wocheneinkauf, Baumarkt und Geburtstag.
  feature:
    status: approved
    tagline: Gemeinsam einkaufen, ohne Werbung.
    alt: Gemeinsame Einkaufsliste ohne Werbung; zwei neue Einträge von Anna sind gelb markiert.

