<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Nexus · Hummlist ops</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to the dashboard</a>
    <header class="top">
      <div class="brand">
        <img src="/favicon.svg" alt="" width="32" height="32">
        <div>
          <h1>Nexus</h1>
          <p class="brand-sub">Hummlist engineering, live</p>
        </div>
      </div>
      <div class="top-tools">
        <p id="freshness" class="freshness" role="status" data-level="fresh">loading</p>
        <button id="theme" class="theme" type="button">Theme: auto</button>
      </div>
    </header>
    <div id="app"></div>
    <dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
      <div class="drawer-inner">
        <header class="drawer-head">
          <h2 id="drawer-title">Job</h2>
          <button id="drawer-close" class="close" type="button" aria-label="Close">Close</button>
        </header>
        <div id="drawer-body"></div>
      </div>
    </dialog>
  </body>
</html>
