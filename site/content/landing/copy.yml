  en: "Until then: start jotting down what goes on your first list."
  status: draft
  source: "Launch V1 thank-you line."
waitlist.confirm.invalid-title:
  de: "Schon bestätigt oder abgelaufen"
  en: "Already confirmed or expired"
  status: draft
  source: "Spec #10 AC11: the neutral page."
waitlist.confirm.invalid-body:
  de: "Dieser Link ist schon benutzt oder nicht mehr gültig. Hast du schon bestätigt, musst du nichts weiter tun. Sonst trag dich einfach noch mal ein."
  en: "This link has been used already or is no longer valid. If you've confirmed, there's nothing more to do. If not, just sign up again."
  status: draft
  source: "New draft for v1's expired link page, which was not handed over."

