waitlist.confirm.body:
  de: "Diese Adresse wurde für die Warteliste der Snacklist-Beta eingetragen, von dir selbst oder zum Beispiel von einem KI-Assistenten für dich. Auf der Liste stehst du erst, wenn du hier selbst auf „E-Mail bestätigen“ tippst."
  en: "This address was entered for the Snacklist beta waitlist, by you or, for example, by an AI assistant for you. You're only on the list once you tap \"Confirm email\" here yourself."
