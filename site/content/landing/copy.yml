  source: "Launch shared blocks, state 2."
waitlist.confirm.done-body:
  de: "Danke! Sobald die Beta startet, bekommst du die Einladung per E-Mail an diese Adresse."
  en: "Thank you! Once the beta starts, you'll get your invite by email at this address."
