waitlist.confirm.not-you:
  de: "Das warst nicht du? Dann schließ diese Seite einfach. Ohne Bestätigung löschen wir die Adresse nach 7 Tagen."
  en: "Wasn't you? Just close this page. Without confirmation we delete the address after 7 days."
  status: draft
  source: "Legal Review 2026-11-04, C-1/C-2 line below the button, word for word."
