voice.title:
  de: "Sag es einfach. Snacklist hört zu."
  en: "Just say it. Snacklist is listening."
  status: draft
  source: "6b prototype; English new."
voice.lead:
  de: "Hände voller Taschen oder Teig an den Fingern? Dann sprich, und es steht auf der Liste."
  en: "Hands full of bags or dough on your fingers? Just speak, and it's on the list."
  status: draft
  source: "6b prototype; English new."
voice.app.title:
  de: "In der App"
  en: "In the app"
  status: draft
  source: "New (job 150): card of the in-app dictation video."
voice.app.body:
  de: "In der iPhone- und Android-App tippst du auf das Mikrofon im Eingabefeld und sagst, was fehlt. Snacklist hört direkt auf dem Handy zu, auf Deutsch, und sortiert jedes Teil in seine Kategorie."
  en: "In the iPhone and Android app, tap the microphone in the input field and say what you need. Snacklist listens right on your phone, in German, and sorts each item into its category."
  status: draft
  source: "New (job 150), from FEATURES-FOR-WRITERS \"Dictation\": iPhone and Android app only, German, on the device; the splitting needs a connection. Replaces the Siri card's in-app sentence."
voice.ai.title:
  de: "Mit KI-Assistenten"
  en: "With AI assistants"
  status: draft
  source: "New: replaces the prototype's one-line MCP mention."
voice.ai.body:
  de: "Verbinde einen KI-Assistenten, der MCP unterstützt, über den MCP-Server von Snacklist mit eurer Liste. Dann schreibst oder sagst du ihm, was fehlt, und er setzt es auf die Liste."
  en: "Connect an AI assistant that supports MCP to your list through the Snacklist MCP server. Then write or tell it what's missing, and it puts it on the list."
  status: draft
  source: "New, from the help page's MCP answer (MCP server under More › Connections)."
voice.siri.title:
  de: "Mit Siri"
  en: "With Siri"
  status: draft
  source: "6b prototype; English new."
voice.siri.now:
  de: "Mit einem [Kurzbefehl](/de/anleitungen/siri-kurzbefehl) setzt Siri es auf die Liste."
  en: "With a [shortcut](/en/guides/siri-shortcut), Siri puts it on the list."
  status: draft
  source: "Job 82 Addendum 7: no „bald“/\"soon\" promise; the Shortcut works today. Job 150: the in-app sentence moved to voice.app.body, the card with the dictation video."

privacy.title:
  de: "Eure Liste bleibt eure Sache."
  en: "Your list stays your business."
  status: draft
  source: "6b prototype; English new."
privacy.lead:
  de: "Snacklist zeigt keine Werbung und verkauft keine Daten."
  en: "Snacklist shows no ads and sells no data."
  status: reused
  source: "Privacy policy (/datenschutz, /en/privacy), word for word."
privacy.frankfurt:
  de: "**Gespeichert in Frankfurt am Main.** Dort steht die Datenbank."
  en: "**Stored in Frankfurt am Main.** That's where the database is."
  status: draft
  source: "6b prototype; privacy policy: the database is in a data centre in Frankfurt am Main. English new."
privacy.consent:
  de: "**Nutzungsdaten nur mit deinem Ja.** Du kannst es jederzeit wieder abschalten."
  en: "**Usage data only with your yes.** You can switch it off again at any time."
  status: draft
  source: "6b prototype; privacy policy section on usage data. English new."
privacy.export:
  de: "**Alles zum Mitnehmen.** Exportiere deine Daten als JSON-Datei."
  en: "**Take it all with you.** Export your data as a JSON file."
  status: draft
  source: "6b prototype, aligned with the help page („als JSON-Datei“); English new."
privacy.delete:
  de: "**Löschen geht in der App.** Dein Konto löschst du dort selbst, sofort."
  en: "**Deleting works in the app.** You delete your account there yourself, right away."
  status: draft
  source: "Job 82 Addendum 6: no menu path on the landing page."
privacy.website:
  de: "**Diese Website ist leise:** keine Cookies, kein Tracking, nichts von fremden Servern. Trägst du dich ein, liegt deine E-Mail-Adresse in unserer Datenbank bei Supabase in Frankfurt. Unser Hoster Vercel und unser Mail-Dienst Resend sind US-Firmen; Resend speichert unsere Mails in den USA. Nur für die Warteliste und die Einladung."
  en: "**This website is quiet:** no cookies, no tracking, nothing loaded from other servers. If you sign up, your email address is kept in our database at Supabase in Frankfurt. Our host Vercel and our email service Resend are US companies; Resend stores our emails in the USA. Only for the waitlist and the invite."
  status: draft
  source: "Legal Review handoff 2026-11-02 21:55 (W5, N-49), word for word."
privacy.more:
  de: "Alles Weitere steht in der [Datenschutzerklärung](/datenschutz)."
  en: "Everything else is in the [privacy policy](/en/privacy)."
  status: draft
  source: "New: link to the published policy (shown only while privacyPublished is on)."

founder.title:
  de: "Von Peter"
  en: "From Peter"
  status: draft
  source: "Peter 2026-11-05 (job 139): founder note between the privacy block and the sign-up form."
founder.body:
  de: "Ich wollte eine App, die ich mit meiner Frau teilen und KI für mich verwalten kann. Darum baue ich Snacklist: Wir schreiben beide auf dieselbe Liste, und über MCP können KI-Assistenten Sachen hinzufügen, abhaken und die Liste lesen. In der Beta testest du Snacklist mit uns und sagst uns, was dir noch fehlt. — Peter"
  en: "I wanted an app I can share with my wife and that AI can manage. So I'm building Snacklist: we both use the same list, and via MCP, AI assistants can add items, check them off and read the list. In the beta you test Snacklist with us and tell us what's still missing. — Peter"
  status: draft
  source: "Peter 2026-11-05 (job 139), word for word; brand-free AI line (Legal L-1). Waitlist and beta stages only."

test.help:
  de: "Fragen zum Test?"
  en: "Questions about the test?"
  status: draft
  source: "New: link to the help page (shown only while supportPublished is on)."

demo.play:
  de: "Video abspielen"
  en: "Play video"
  status: draft
  source: "New: label of the demo videos' play button."
demo.pause:
  de: "Video anhalten"
  en: "Pause video"
  status: draft
  source: "New: label of the demo videos' pause button."
demo.add-tick:
  de: "Video ohne Ton: Im Haushalt „Unser Haushalt“ tippt Anna „Honig“ und „Marmelade“ ins Eingabefeld der Snacklist-App. Beide landen beim Wochenmarkt unter Vorrat & Konserven, oben in der Liste. Danach hakt je ein Tipp sie wieder ab."
  en: "Silent video: in the household “Our Home”, Anna types “Honey” and “Jam” into the Snacklist app’s input field. Both land at the Farmers market under Pantry, at the top of the list. Then one tap each ticks them off again."
  status: draft
  source: "Job 54: text alternative of the add-tick video; job 215 re-filmed it with the demo household „Unser Haushalt“ (marketing/videos/capture/shots.ts)."
demo.household-sync:
  de: "Video ohne Ton: zwei Handys im Haushalt „Unser Haushalt“. Anna setzt Eier auf die Liste, gleich darauf stehen sie bei Jonas beim Wochenmarkt, mit dem Hinweis „1 neu von Anna“. Jonas hakt sie ab, und sie verschwinden bei beiden."
  en: "Silent video: two phones in the household “Our Home”. Anna puts eggs on the list; right after, they are on Jonas’s phone at the Farmers market, with the note “1 new from Anna”. Jonas ticks them off, and they disappear for both."
  status: draft
  source: "Job 54: text alternative of the household-sync video; job 215 re-filmed it with the demo household „Unser Haushalt“ (Anna and Jonas) instead of the Brandt family."

demo.voice-add:
  de: "Video ohne Ton: Mia tippt auf das Mikrofon im Eingabefeld der Snacklist-App und sagt „Pizza, Orangensaft und zwei Packungen Fischstäbchen“. Die Wörter erscheinen im Feld, während sie spricht. Sie tippt auf Stopp, und gleich darauf stehen Orangensaft unter Getränke und Pizza und 2 Packungen Fischstäbchen unter Tiefkühl. Im Laden hakt sie alle drei ab."
  en: "Silent video: Mia taps the microphone in the Snacklist app’s input field and says, in German, “Pizza, Orangensaft und zwei Packungen Fischstäbchen” (pizza, orange juice and two packs of fish fingers). The words appear in the field as she speaks. She taps stop, and right after, Orangensaft is under Drinks and Pizza and 2 Packungen Fischstäbchen under Frozen. In the store she ticks all three off."
  status: draft
  source: "Job 150: text alternative of the voice-add video; matches its take (marketing/videos/capture/shots.ts). The app listens in German in every language."
demo.mcp-chat:
  de: "Video ohne Ton: Ein KI-Chat bekommt „Schreib Honig und Marmelade auf“. Snacklist meldet beide unter Vorrat & Konserven, und sie erscheinen in der App. Per Sprache folgt „Hab beides gekauft, hak es ab“, und beide verschwinden wieder."
  en: "Silent video: an AI chat gets “Put honey and jam on the list”. Snacklist reports both under Pantry, and they appear in the app. By voice follows “Bought both, tick them off”, and both disappear again."
  status: draft
  source: "Job 54: text alternative of the mcp-chat video; the results are the real MCP answers of the take."

