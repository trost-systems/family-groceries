# Waitlist landing variations V1-V5 (job 83): an internal preview, never built for production.
# Source: Hummlist Launch, "Landing page hummlist.com: Warteliste, Varianten V1–V5 (02.11.2026)"
# and "Installations-FAQ (02.11.2026)". The copy is a draft and verbatim; do not edit it here
# without a new copy version from Launch.
#
# Each variant lists its blocks in page order. `notes` are the reviewer markers of the source
# ([LEGAL CHECK], [PM CHECK: …], [PETER CHECK: …]); the page shows them as review tags. The
# [LEGAL: …] placeholders are part of the copy and stay visible. `install: true` on an FAQ marks
# where the source says [INSTALL-FAQ]; the install entries from `shared` go there.

shared:
  de:
    review: "Interne Vorschau"
    overview: "Alle Varianten"
    skip: "Zum Inhalt"
    variant: "Variante"
    language: "Sprache"
    state: "Zustand"
    states: { page: "Seite", inbox: "Postfach", confirmed: "Bestätigt", known: "Schon drauf" }
    mock: "Mock: Link in der Mail antippen"
    header-cta: "Auf die Warteliste"
    faq: "FAQ"
    form:
      email: "E-Mail-Adresse"
      email-placeholder: "name@beispiel.de"
      email-hint: "Am besten die E-Mail deiner Apple-ID bzw. deines Google-Kontos"
      platform: "Dein Handy:"
      ios: "iPhone"
      android: "Android"
      button: "Auf die Warteliste"
      below: "Wir schreiben dir nur zur Beta und zum Start der App. Abmelden geht jederzeit."
      consent: "[LEGAL: Einwilligungstext + Link Datenschutzerklärung]"
      sending: "Einen Moment …"
      known: "Diese E-Mail steht schon auf der Warteliste. Deine Einladung kommt per E-Mail."
      email-missing: "Bitte gib deine E-Mail-Adresse ein."
      email-invalid: "Diese E-Mail-Adresse sieht nicht richtig aus. Prüf sie bitte noch mal."
      platform-missing: "Bitte wähl iPhone oder Android."
    inbox:
      title: "Fast geschafft, check dein Postfach"
      body: "Wir haben dir eine E-Mail an [E-MAIL] geschickt. Tipp darin auf „E-Mail bestätigen“, dann stehst du auf der Warteliste."
      small: "Nichts angekommen? Schau im Spam-Ordner nach oder trag dich mit der richtigen Adresse noch mal ein."
    confirmed:
      title: "Du stehst auf der Warteliste"
      body: "Danke! Die Beta startet im November, und wir laden jede Woche neue Tester:innen ein. Deine Einladung kommt per E-Mail an diese Adresse."
      back: "Zurück zu hummlist.com"
    install:
      - q: "Wie installiere ich die Beta auf dem iPhone?"
        a: "Deine Einladung kommt per E-Mail von Apple (TestFlight), an die Adresse, mit der du dich auf der Warteliste eingetragen hast. Lad dir zuerst Apples kostenlose App „TestFlight“ aus dem App Store. Öffne dann die Einladungsmail auf deinem iPhone, tipp auf den Knopf darin und installier Hummlist in TestFlight. Einen öffentlichen Link gibt es nicht."
      - q: "Wie installiere ich die Beta auf Android?"
        a: "In deiner Einladungsmail ist ein Knopf „Beta beitreten“. Öffne ihn auf deinem Handy, und zwar mit dem Play Store im selben Google-Konto wie die E-Mail-Adresse, an die die Einladung ging. Bestätige dort die Teilnahme und installier Hummlist dann aus dem Play Store. Updates kommen danach ganz normal über den Play Store."
      - q: "Ich habe mich mit der falschen E-Mail eingetragen. Was jetzt?"
        a: "Die Einladung klappt nur mit der E-Mail deiner Apple-ID (iPhone) bzw. deines Google-Kontos (Android). Trag dich auf hummlist.com einfach noch mal mit der richtigen Adresse ein."
      - q: "Meine Einladung ist nicht angekommen. Was kann ich tun?"
        a: "Schau im Spam-Ordner nach und bei Gmail auch im Tab „Werbung“. Wir verschicken die Einladungen in Wellen: die erste am 15. November, danach jede Woche. Auf dem iPhone kommt die TestFlight-Mail von Apple, nicht von Hummlist. Fehlt sie dann immer noch, schreib an support@hummlist.com."
  en:
    review: "Internal preview"
    overview: "All variants"
    skip: "Skip to content"
    variant: "Variant"
    language: "Language"
    state: "State"
    states: { page: "Page", inbox: "Inbox", confirmed: "Confirmed", known: "Already on it" }
    mock: "Mock: tap the link in the email"
    header-cta: "Join the waitlist"
    faq: "FAQ"
    form:
      email: "Email address"
      email-placeholder: "name@example.com"
      email-hint: "Ideally the email of your Apple ID or Google account"
      platform: "Your phone:"
      ios: "iPhone"
      android: "Android"
      button: "Join the waitlist"
      below: "We'll only email you about the beta and the app's launch. Unsubscribe anytime."
      consent: "[LEGAL: consent text + link to privacy policy]"
      sending: "One moment …"
      known: "This email is already on the waitlist. Your invite will come by email."
      email-missing: "Please enter your email address."
      email-invalid: "This email address doesn't look right. Please check it."
      platform-missing: "Please choose iPhone or Android."
    inbox:
      title: "Almost there, check your inbox"
      body: "We sent an email to [EMAIL]. Tap \"Confirm email\" in it, and you're on the waitlist."
      small: "Nothing arrived? Check your spam folder, or sign up again with the right address."
    confirmed:
      title: "You're on the waitlist"
      body: "Thank you! The beta starts in November, and we invite new testers every week. Your invite will come by email to this address."
      back: "Back to hummlist.com"
    install:
      - q: "How do I install the beta on iPhone?"
        a: "Your invite comes by email from Apple (TestFlight), sent to the address you used for the waitlist. First, get Apple's free TestFlight app from the App Store. Then open the invite email on your iPhone, tap the button in it, and install Hummlist in TestFlight. There's no public link."
      - q: "How do I install the beta on Android?"
        a: "Your invite email has a \"Join the beta\" button. Open it on your phone, with the Play Store signed in to the same Google account as the email address the invite went to. Accept there, then install Hummlist from the Play Store. After that, updates arrive as normal Play Store updates."
      - q: "I signed up with the wrong email. What now?"
        a: "The invite only works with the email of your Apple ID (iPhone) or Google account (Android). Just sign up again on hummlist.com/en with the right address."
      - q: "My invite hasn't arrived. What can I do?"
        a: "Check your spam folder, and in Gmail the Promotions tab too. We send invites in waves: the first on November 15, then every week. On iPhone, the TestFlight email comes from Apple, not from Hummlist. If it's still missing, write to support@hummlist.com."

variants:
  v1:
    name: "Ohne Werbung, verbessert (approved Hero-Titel)"
    angle: "„Ohne Werbung“ ist das einzige Kern-Versprechen, das die großen Konkurrenten nicht ohne Haken geben können, also führen wir damit und machen es greifbar."
    order: "Header (Logo + „Auf die Warteliste“) → Hero mit Formular → 4 Value Points → MCP-Extra (kleiner Block) → Gründer-Notiz → FAQ → Abschluss-CTA → Footer"
    de:
      meta:
        title: "Hummlist: gemeinsam einkaufen, ohne Werbung"
        description: "Die gemeinsame Einkaufsliste ohne Banner und Prospekt-Angebote, bei allen sofort aktuell. Beta im November: Trag dich jetzt auf die Warteliste ein."
      thanks: "Bis dahin: Schreib schon mal auf, was auf eure erste Liste kommt."
      blocks:
        - type: hero
          badge: "Beta im November"
          title: "Gemeinsam einkaufen, ohne Werbung"
          visual: hero
          subline: "Auf eurer Liste steht nur, was ihr braucht. Keine Banner, keine Prospekt-Angebote zwischen Milch und Brot."
          small: "Für Paare, Familien und WGs, auf iPhone und Android."
          form:
            heading: "Sei bei der Beta dabei"
            intro: "Die Beta startet im November und ist kostenlos. Trag dich ein, dann schicken wir dir die Einladung per E-Mail."
        - type: points
          items:
            - { title: "Wirklich keine Werbung.", body: "Keine Banner, keine gesponserten Einträge, kein „Jetzt upgraden“ mitten im Einkauf." }
            - { title: "Bei allen sofort aktuell.", body: "Du schreibst zu Hause Butter drauf, und wer gerade im Laden steht, sieht sie direkt." }
            - { title: "Sortiert wie dein Laden.", body: "Zieh die Kategorien in die Reihenfolge, in der du durch deinen Laden gehst. Hummlist sortiert deine Artikel automatisch in Kategorien und lernt aus deinen Korrekturen." }
            - { title: "Schnell drauf.", body: "Tipp „2 Gurken“ oder sprich es ein, Hummlist erkennt die Menge." }
        - type: extra
          heading: "Wenn du magst: Verbinde Hummlist mit Claude & Co."
          body: "Über MCP können Claude und andere KI-Assistenten auf eure Liste schreiben. Zum Beispiel: Rezept rein, Zutaten auf die Liste. Musst du nicht nutzen, Hummlist funktioniert auch ganz ohne. Siri, bald."
          notes: ["[LEGAL CHECK]"]
        - type: note
          text: "Ich wollte eine App, die ich mit meiner Frau teilen und KI für mich verwalten kann. In der Beta testest du sie mit uns und sagst uns direkt, was fehlt."
          signature: "— Peter"
          notes: ["[PETER CHECK: Gründer-Notiz in eigenen Worten bestätigen]"]
        - type: faq
          items:
            - { q: "Was ist Hummlist?", a: "Eine gemeinsame Einkaufsliste für alle, die zusammen einkaufen. Jede Änderung ist sofort bei allen da, und es gibt keine Werbung." }
            - { q: "Wann geht's los?", a: "Die Beta startet im November. Danach laden wir jede Woche neue Tester:innen ein, die Einladung kommt per E-Mail." }
            - { q: "Was kostet die Beta?", a: "Die Beta ist kostenlos." }
            - { q: "Brauche ich ein Konto?", a: "Ja, du meldest dich in der App an, zum Beispiel mit Apple, Google oder deiner E-Mail. So bleibt eure Liste auf allen Handys gleich." }
            - { q: "Was passiert mit meiner E-Mail-Adresse?", a: "Wir nutzen sie nur für die Warteliste, die Einladung und Neuigkeiten zum Start. Mehr in der [LEGAL: Link Datenschutzerklärung]." }
            - { install: true }
        - type: closing
          line: "Einkaufen ohne Werbung, ab November."
          button: "Auf die Warteliste"
    en:
      meta:
        title: "Hummlist: shop together, no ads"
        description: "The shared grocery list without banners or sponsored deals, up to date for everyone. Beta in November: join the waitlist now."
      thanks: "Until then: start jotting down what goes on your first list."
      blocks:
        - type: hero
          badge: "Beta in November"
          title: "Shop together, no ads"
          visual: hero
          subline: "Your list only has what you need on it. No banners, no sponsored deals between the milk and the bread."
          small: "For couples, families and roommates, on iPhone and Android."
          form:
            heading: "Be part of the beta"
            intro: "The beta starts in November and is free. Sign up and we'll email you the invite."
        - type: points
          items:
            - { title: "Really no ads.", body: "No banners, no sponsored items, no \"Upgrade now\" in the middle of your shop." }
            - { title: "Up to date for everyone.", body: "You add butter at home, and whoever is at the store sees it right away." }
            - { title: "Sorted like your store.", body: "Drag the categories into the order you walk through your store. Hummlist sorts items into categories automatically and learns from your corrections." }
            - { title: "Quick to add.", body: "Type \"2 cucumbers\" or say it out loud, and Hummlist picks up the amount." }
        - type: extra
          heading: "If you like: connect Hummlist to Claude & co."
          body: "Claude and other AI assistants can add to your list via MCP. For example: paste a recipe, get the ingredients on your list. You don't have to use it; Hummlist works fine without it. Siri, coming soon."
          notes: ["[LEGAL CHECK]"]
        - type: note
          text: "I'm Peter, and I'm building Hummlist because my family wanted a grocery list that just works, without ads. In the beta you test it with us and tell us directly what's missing."
          signature: "— Peter"
          notes: ["[PETER CHECK: confirm founder note in his own words]"]
        - type: faq
          items:
            - { q: "What is Hummlist?", a: "A shared grocery list for everyone who shops together. Every change shows up for everyone right away, and there are no ads." }
            - { q: "When does it start?", a: "The beta starts in November. After that we invite new testers every week; the invite comes by email." }
            - { q: "What does the beta cost?", a: "The beta is free." }
            - { q: "Do I need an account?", a: "Yes, you sign in in the app, for example with Apple, Google or your email. That keeps your list the same on every phone." }
            - { q: "What happens with my email address?", a: "We only use it for the waitlist, your invite and news about the launch. More in the [LEGAL: link to privacy policy]." }
            - { install: true }
        - type: closing
          line: "Grocery shopping without ads, starting in November."
          button: "Join the waitlist"

