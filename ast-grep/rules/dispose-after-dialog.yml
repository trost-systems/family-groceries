# A route does not unmount when its Future completes: showDialog and
# showModalBottomSheet return as soon as the route pops, while the dialog's
# widgets stay mounted for the exit animation. A controller created in the
# calling function and disposed right after the await is still attached to
# a TextField, so Flutter fails with "A TextEditingController was used after
# being disposed" (BOARD 07:20: the join-by-code dialog crashed on every
# close; the bad code is at 26e9d06, fixed in 1177b52 as PR commit f454567).
# The dialog owns its controllers instead: a StatefulWidget that creates them
# in its State and disposes them in State.dispose().
#
# A route is any dialog, sheet, popup, picker, menu or search the show*
# functions open, and a page pushed on Navigator, Navigator.of(...),
# GoRouter.of(...), context or router: each keeps its widgets through the
# exit animation. The rule reports a dispose after `await <route>` in the
# same function, and one in the `.then` or `.whenComplete` callback of
# `<route>`, the tear-off `.whenComplete(c.dispose)` included.
#
# Limits of a syntactic rule (DECISIONS 12.4): it reports a dispose anywhere
# in a function that awaits a route, also one written before the await
# (still a fragile shape; the fix is the same), and it does not follow a
# route opened in a helper function the code awaits, or a route's Future
# stored in a variable and awaited later.
id: dispose-after-dialog
language: dart
severity: error
utils:
  opens-route:
    regex: '^(?:(?:\w+(?:\s*\([^()]*\))?\s*\.\s*)*show(?:Adaptive|Cupertino|General|About|License)?(?:Dialog|ModalBottomSheet|BottomSheet|CupertinoModalPopup|CupertinoSheet|DatePicker|DateRangePicker|TimePicker|Menu|Search|Page)|(?:Navigator|GoRouter|context|_?router)(?:\s*\.\s*of\s*\([^()]*\))?\s*\.\s*(?:push\w*|popAndPushNamed|restorablePush\w*))\s*[<(]'
  # `c.dispose()`, and its tear-off `c.dispose` passed to whenComplete.
  disposes-c:
    kind: member_expression
    all:
      - has:
          field: property
          regex: '^dispose$'
      - has:
          field: object
          any:
            - kind: identifier
              pattern: $C
            # tree-sitter-dart reads `(_) => c.dispose()` as `((_) => c).dispose()`.
            - kind: function_expression
              has:
                field: body
                has:
                  kind: identifier
                  pattern: $C
rule:
  any:
    - kind: call_expression
      has:
        field: function
        matches: disposes-c
    - matches: disposes-c
      inside:
        kind: arguments
  all:
    - any:
        - inside:
            stopBy: end
            kind: function_body
            has:
              stopBy: end
              kind: await_expression
              has:
                matches: opens-route
        - inside:
            stopBy: end
            kind: call_expression
            has:
              field: function
              kind: member_expression
              all:
                - has:
                    field: object
                    matches: opens-route
                - has:
                    field: property
                    regex: '^(?:then|whenComplete)$'
    - inside:
        stopBy: end
        kind: function_body
        has:
          stopBy: end
          kind: initialized_variable_definition
          all:
            - has:
                field: name
                pattern: $C
            - has:
                field: value
                regex: '^(?:new\s+)?(?:TextEditingController|FocusNode|ScrollController|SearchController)\b'
message: '$C is disposed after a dialog, sheet or pushed route whose widgets may still use it during the exit animation: move $C into the route as a StatefulWidget that creates it in its State and disposes it in State.dispose() (see _JoinCodeDialog in app/lib/household/invite_dialog.dart)'
