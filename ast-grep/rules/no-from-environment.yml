# Build-time defines are read in one file, app/lib/app/environment.dart
# (CLAUDE.md): `String.fromEnvironment`, `bool.fromEnvironment`,
# `int.fromEnvironment` and `bool.hasEnvironment`, called, torn off or
# `const`, through a `dart:core` import prefix or not. One inventory of
# defines and one fail-fast point. Ported from emotely's rule of the same id.
#
# Only syntax is matched: a constructor of our own named `fromEnvironment` on
# another class passes; `String`, `bool` and `int` are the SDK's.
id: no-from-environment
language: dart
severity: error
ignores:
  - app/lib/app/environment.dart
rule:
  pattern: $E
  any:
    - kind: member_expression
      all:
        - has:
            field: property
            regex: '^(?:from|has)Environment$'
        - has:
            field: object
            regex: '^(?:\w+\s*\.\s*)?(?:String|bool|int)$'
    - kind: const_object_expression
      regex: '^const\s+(?:\w+\s*\.\s*)?(?:String|bool|int)\s*\.\s*(?:from|has)Environment\b'
    - kind: new_expression
      regex: '^new\s+(?:\w+\s*\.\s*)?(?:String|bool|int)\s*\.\s*(?:from|has)Environment\b'
transform:
  READ:
    replace:
      source: $E
      replace: '(?s)\A.*?\b((?:String|bool|int)\s*\.\s*(?:from|has)Environment)\b.*\z'
      by: "$1"
message: '"$READ" reads a --dart-define outside app/lib/app/environment.dart: add a field to Environment there and read that instead'
