# Flutter 3.50's web engine keeps a hidden copy of every autofill field the user has left, in an
# off-screen form, so the browser can still save credentials (flutter/flutter#180652). A field's
# autofill is on by default, so every field with a hint left a second, unseen textbox of the same
# name for screen readers (and Playwright) to find (job 201). A field says what it wants:
# `autofillHints: null` for no autofill, or its hints (the login fields).
id: text-field-autofill-explicit
language: dart
severity: error
files:
  - app/lib/**
ignores:
  - app/lib/l10n/**
rule:
  kind: call_expression
  has:
    field: function
    regex: '(?:^|[^\w.])(?:TextField|TextFormField|CupertinoTextField)$'
  not:
    has:
      kind: arguments
      has:
        kind: named_argument
        has:
          kind: label
          regex: '^autofillHints\s*:$'
message: 'Say whether this text field takes autofill: autofillHints: null for none, or its AutofillHints; Flutter web otherwise leaves a hidden duplicate of it for screen readers once it loses focus (job 201)'
