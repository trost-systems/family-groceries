# Flutter 3.50 moved Material and Cupertino into the material_ui and cupertino_ui packages (job 201),
# but gen-l10n still lists flutter_localizations' in-framework delegates in
# AppLocalizations.localizationsDelegates. A MaterialApp given that list finds no
# MaterialLocalizations for any material_ui widget: every TextField, AppBar and dialog throws.
# appLocalizationsDelegates (app/lib/app/localizations.dart) lists the material_ui ones.
id: localizations-through-app-list
language: dart
severity: error
files:
  - app/**
ignores:
  - app/lib/l10n/**
rule:
  kind: member_expression
  all:
    - has:
        field: property
        regex: '^localizationsDelegates$'
    - has:
        field: object
        regex: '^(?:\w+\s*\.\s*)?AppLocalizations$'
message: 'AppLocalizations.localizationsDelegates carries the in-framework Material delegate, which material_ui widgets do not read: use appLocalizationsDelegates from package:family_groceries/app/localizations.dart'
