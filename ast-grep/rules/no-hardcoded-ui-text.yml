# The UI speaks German from app/l10n/app_de.arb (CLAUDE.md, SPEC: "strings in
# an ARB/l10n file so English can be added later"). A string literal that
# reads as language and reaches a text position is reported. A text position
# is the text of Text or SelectableText, or a named argument through which
# Flutter shows text (emotely's avoid_hardcoded_ui_text list plus the date,
# time, about and search dialogs' texts). `shown-as-text` below lists how a
# value reaches it: `Text(done ? 'Erledigt' : 'Offen')`,
# `Text('Hallo'.toUpperCase())`, `Text(['Eins', 'Zwei'][i])` all fail.
#
# A literal reads as language when its own text (outside interpolations) has
# a letter and it is not a path or URL. A constant declared in the same file
# counts as the literal.
#
# What a syntactic rule cannot follow (DECISIONS 12.3): a value that leaves
# through another call's argument and comes back as its result (a closure
# such as `.map((e) => 'Nr. $e')`, a helper function), and a constant
# imported from another file. Both need types and data flow, which is what
# the analyzer would give at the RAM cost DECISIONS 12.1 avoids. A non-widget
# class with a parameter of one of these names is reported too: give it the
# value from AppLocalizations.
id: no-hardcoded-ui-text
language: dart
severity: error
files:
  - app/lib/**
ignores:
  - app/lib/l10n/**
utils:
  language-literal:
    kind: string_literal
    all:
      - any:
          - has:
              stopBy: end
              regex: '\p{L}'
              any:
                - kind: template_chars_single_single
                - kind: template_chars_double_single
                - kind: template_chars_single
                - kind: template_chars_double
          - regex: '(?s)^r[''"]+.*\p{L}'
      - not:
          regex: '^r?[''"]+[^\s/''"]*/[^\s''"]*[''"]+$'
  # Directly in a text position: the argument of Text or SelectableText, or
  # the value of a named argument Flutter shows as text.
  text-position:
    any:
      - inside:
          kind: arguments
          inside:
            any:
              - kind: call_expression
                has:
                  field: function
                  regex: '(?:^|[^\w.])(?:Text|SelectableText)$'
              - kind: const_object_expression
                has:
                  field: type
                  regex: '^(?:Text|SelectableText)$'
      - inside:
          kind: named_argument
          has:
            kind: label
            regex: '^(?:applicationLegalese|applicationName|barrierLabel|cancelText|confirmText|counterText|errorFormatText|errorInvalidText|errorText|fieldHintText|fieldLabelText|helpText|helperText|hint|hintText|label|labelText|message|prefixText|searchFieldLabel|semanticCounterText|semanticLabel|semanticsLabel|semanticsValue|subtitle|suffixText|text|title|tooltip)\s*:$'
  # A text position, or reached from one by a value that flows up unchanged
  # or transformed: a ternary's branches, `??`, `+`, `!`, parentheses,
  # switch-expression arms, list and set elements, map values, and the
  # receiver of a method call, property or index (`'Hallo'.toUpperCase()`,
  # `['Eins', 'Zwei'][i]`). An argument of any other call, an index or a map
  # key, a condition or a switch pattern is data, not shown text.
  shown-as-text:
    any:
      - matches: text-position
      - inside:
          matches: shown-as-text
          any:
            - kind: conditional_expression
            - kind: if_null_expression
            - kind: additive_expression
            - kind: parenthesized_expression
            - kind: null_assertion_expression
            - kind: switch_expression
            - kind: switch_expression_case
            - kind: list_literal
            - kind: set_or_map_literal
      - inside:
          matches: shown-as-text
          kind: pair
          field: value
      - inside:
          matches: shown-as-text
          kind: member_expression
          field: object
      - inside:
          matches: shown-as-text
          kind: call_expression
          field: function
      - inside:
          matches: shown-as-text
          kind: index_expression
          field: object
rule:
  matches: shown-as-text
  any:
    - matches: language-literal
    - any:
        - kind: identifier
          pattern: $NAME
        - kind: member_expression
          has:
            field: property
            pattern: $NAME
      inside:
        stopBy: end
        kind: source_file
        has:
          stopBy: end
          any:
            - kind: static_final_declaration
            - kind: initialized_variable_definition
          all:
            - has:
                field: name
                pattern: $NAME
            - has:
                field: value
                matches: language-literal
message: 'A user-visible string is written into the UI as a literal: add it to app/l10n/app_de.arb and read it through AppLocalizations.of(context)'
