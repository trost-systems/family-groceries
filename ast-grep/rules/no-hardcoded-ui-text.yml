# The UI speaks German from app/l10n/app_de.arb (CLAUDE.md, SPEC: "strings in
# an ARB/l10n file so English can be added later"). A string literal that
# reads as language and reaches a text position is reported. A text position
# is the text of Text or SelectableText, or a named argument through which
# Flutter shows text (emotely's avoid_hardcoded_ui_text list plus the date,
# time, about and search dialogs' texts). `shown-as-text` below lists how a
# value reaches it: `Text(done ? 'Erledigt' : 'Offen')`,
# `Text('Hallo'.toUpperCase())`, `Text(['Eins', 'Zwei'][i])` all fail.
#
# A literal reads as language when its own text (outside interpolations) has
# a letter and it is not a path or URL. A declaration in the same file whose
# name reaches a text position is followed to its value: a constant, final,
# variable or field (`const _labels = ['Eins']; Text(_labels[0])`), a value
# assigned to it (`msg = 'Gespeichert';`), a parameter's default value, an
# enum constant's arguments when a field of the enum is shown, and what a
# getter, function or method returns (`String get _title => 'Titel';`,
# `String _nr(int n) => 'Nr. $n';`). The literal is reported where it is
# declared. Names are matched, not resolved, so `Text(other.title)` also
# reports the literal behind an unrelated `title` getter in the same file,
# and every literal argument of an enum constant counts, not only the one
# that fills the shown field. toString overrides are skipped: `Text(n.
# toString())` shows n.
#
# What a syntactic rule cannot follow (DECISIONS 12.3): a value that goes
# into another call's argument and comes back as its result (a closure such
# as `.map((e) => 'Nr. $e')`, a custom widget's positional parameter that
# it shows with Text), a declaration whose value is another declaration's
# name (`const _b = _a;`), and a constant imported from another file. These
# need types and data flow, which is what the analyzer would give at the
# RAM cost DECISIONS 12.1 avoids. A non-widget class with a parameter of one
# of these names is reported too: give it the value from AppLocalizations.
id: no-hardcoded-ui-text
language: dart
severity: error
files:
  - app/lib/**
ignores:
  - app/lib/l10n/**
utils:
  language-literal:
    kind: string_literal
    all:
      - any:
          - has:
              stopBy: end
              regex: '\p{L}'
              any:
                - kind: template_chars_single_single
                - kind: template_chars_double_single
                - kind: template_chars_single
                - kind: template_chars_double
          - regex: '(?s)^r[''"]+.*\p{L}'
      - not:
          regex: '^r?[''"]+[^\s/''"]*/[^\s''"]*[''"]+$'
  # Directly in a text position: the argument of Text or SelectableText, or
  # the value of a named argument Flutter shows as text.
  text-position:
    any:
      - inside:
          kind: arguments
          inside:
            any:
              - kind: call_expression
                has:
                  field: function
                  regex: '(?:^|[^\w.])(?:Text|SelectableText)$'
              - kind: const_object_expression
                has:
                  field: type
                  regex: '^(?:Text|SelectableText)$'
      - inside:
          kind: named_argument
          has:
            kind: label
            regex: '^(?:applicationLegalese|applicationName|barrierLabel|cancelText|confirmText|counterText|errorFormatText|errorInvalidText|errorText|fieldHintText|fieldLabelText|helpText|helperText|hint|hintText|label|labelText|message|prefixText|searchFieldLabel|semanticCounterText|semanticLabel|semanticsLabel|semanticsValue|subtitle|suffixText|text|title|tooltip)\s*:$'
  # A text position, or reached from one by a value that flows up unchanged
  # or transformed: a ternary's branches, `??`, `+`, `!`, parentheses,
  # switch-expression arms, list and set elements (collection `if` and `for`
  # included), map values, a shown name's declaration, and the
  # receiver of a method call, property or index (`'Hallo'.toUpperCase()`,
  # `['Eins', 'Zwei'][i]`). An argument of any other call, an index or a map
  # key, a condition or a switch pattern is data, not shown text.
  shown-as-text:
    any:
      - matches: text-position
      - inside:
          matches: shown-as-text
          any:
            - kind: conditional_expression
            - kind: if_null_expression
            - kind: additive_expression
            - kind: parenthesized_expression
            - kind: null_assertion_expression
            - kind: switch_expression
            - kind: switch_expression_case
            - kind: list_literal
            - kind: set_or_map_literal
      - inside:
          matches: shown-as-text
          kind: if_element
          field: consequence
      - inside:
          matches: shown-as-text
          kind: if_element
          field: alternative
      - inside:
          matches: shown-as-text
          kind: for_element
          field: body
      - inside:
          matches: shown-as-text
          kind: pair
          field: value
      - inside:
          matches: shown-as-text
          kind: member_expression
          field: object
      - inside:
          matches: shown-as-text
          kind: call_expression
          field: function
      - inside:
          matches: shown-as-text
          kind: index_expression
          field: object
      - matches: value-of-shown-name
  # The value of a variable, constant or field, or what a getter or function
  # returns, where the same file shows that name: `const _labels = ['Eins'];`
  # with `Text(_labels[0])`, `String get _title => 'Titel';` with
  # `Text(_title)`. Names are matched, not resolved: a getter `title` in one
  # class and `Text(other.title)` in another count as the same.
  value-of-shown-name:
    all:
      - any:
          - inside:
              field: value
              any:
                - kind: static_final_declaration
                - kind: initialized_variable_definition
                - kind: initialized_identifier
              has:
                field: name
                pattern: $NAME
          # `msg = 'Gespeichert';`, `this._title = 'Titel';`
          - inside:
              kind: assignment_expression
              field: right
              has:
                field: left
                any:
                  - has:
                      kind: identifier
                      pattern: $NAME
                  - has:
                      field: property
                      kind: identifier
                      pattern: $NAME
          # A default parameter value: `{this.caption = 'Speichern'}`.
          - all:
              - inside:
                  kind: optional_formal_parameters
              - follows:
                  stopBy:
                    kind: formal_parameter
                  kind: formal_parameter
                  has:
                    stopBy: end
                    kind: identifier
                    pattern: $NAME
          # An enum constant's argument when one of the enum's fields is shown:
          # `fruit('Obst')` with `final String label;` and `Text(c.label)`.
          # Arguments are not matched to fields by position.
          - inside:
              kind: arguments
              inside:
                stopBy: end
                kind: enum_constant
                inside:
                  stopBy: end
                  kind: enum_declaration
                  has:
                    stopBy: end
                    kind: initialized_identifier
                    has:
                      kind: identifier
                      pattern: $NAME
          - inside:
              kind: function_body
              inside:
                matches: callable-named
          - inside:
              kind: return_statement
              inside:
                stopBy:
                  any:
                    - kind: function_body
                    - kind: function_expression_body
                kind: function_body
                inside:
                  matches: callable-named
      - inside:
          stopBy: end
          kind: source_file
          has:
            stopBy: end
            matches: shown-as-text
            # `Text(n.toString())` shows n, not a toString override in the file.
            not:
              any:
                - regex: '^toString$'
                - has:
                    field: property
                    regex: '^toString$'
            any:
              - kind: identifier
                pattern: $NAME
              - kind: member_expression
                has:
                  field: property
                  pattern: $NAME
  # A getter, function or method declaration named $NAME.
  callable-named:
    has:
      field: signature
      any:
        - has:
            field: name
            pattern: $NAME
        - has:
            any:
              - kind: getter_signature
              - kind: function_signature
            has:
              field: name
              pattern: $NAME
rule:
  all:
    - matches: language-literal
    - matches: shown-as-text
message: 'A user-visible string is written into the UI as a literal: add it to app/l10n/app_de.arb and read it through AppLocalizations.of(context)'
