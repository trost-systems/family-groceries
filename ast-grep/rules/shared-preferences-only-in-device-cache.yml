# One owner for the app's own on-device store: DeviceCache
# (app/lib/app/device_cache.dart). supabase_flutter keeps the session in
# shared_preferences.json through the legacy SharedPreferences API; on Linux
# a second store on that same file rewrites it from its own copy and the
# session is lost (BOARD 09:08: a relaunched Linux app came back signed out;
# the store was built in main.dart as `SharedPreferencesAsync()`, fixed in
# c4ed2e4). Any other code that needs to remember something on the device
# goes through DeviceCache, whose store has its own file.
#
# Matched as an expression (a call, a tear-off, a static member), so a type
# annotation such as a constructor parameter `SharedPreferencesAsync prefs`
# passes. Tests set up fakes and are not checked.
id: shared-preferences-only-in-device-cache
language: dart
severity: error
files:
  - app/lib/**
ignores:
  - app/lib/app/device_cache.dart
rule:
  pattern: $STORE
  kind: identifier
  regex: '^SharedPreferences(?:Async|WithCache)?$'
message: '$STORE opens a shared-preferences store outside DeviceCache: use DeviceCache (app/lib/app/device_cache.dart), which owns the one store with its own file on Linux; a second store on supabase''s shared_preferences.json loses the session'
---
# Inside DeviceCache: the store is SharedPreferencesAsync with its own Linux
# file. Without SharedPreferencesLinuxOptions, or with the legacy
# SharedPreferences API, it shares shared_preferences.json with
# supabase_flutter's session again (the BOARD 09:08 bug).
id: device-cache-own-file
language: dart
severity: error
files:
  - app/lib/app/device_cache.dart
rule:
  any:
    - kind: identifier
      regex: '^SharedPreferences(?:WithCache)?$'
    - kind: call_expression
      has:
        field: function
        regex: '^(?:const\s+|new\s+)?SharedPreferencesAsync$'
      not:
        has:
          field: arguments
          regex: '\bSharedPreferencesLinuxOptions\s*\('
          not:
            regex: 'fileName:\s*r?[''"]shared_preferences[''"]'
message: 'DeviceCache''s store must not share supabase''s shared_preferences.json: build it as SharedPreferencesAsync(options: const SharedPreferencesLinuxOptions(fileName: ''device_cache''))'
