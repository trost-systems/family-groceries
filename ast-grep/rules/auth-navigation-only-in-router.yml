# Auth gating happens only in authRedirect (app/lib/app/router.dart,
# CLAUDE.md): screens never navigate to the sign-in or onboarding routes
# themselves. Signing out or leaving a household changes SessionCubit's
# state, and the router's redirect sends the user to /login or /welcome
# (and back, carrying a pending invite). A screen that calls
# go('/login') skips the redirect's invite carry-over and races it.
#
# Nothing outside router.dart has a reason to name these routes, so the rule
# reports the names themselves, not only a navigation call: a '/login' or
# '/welcome' path literal anywhere (a const `_p = '/login'` later passed to
# go(_p), a Uri(path: '/welcome')), loginPath and welcomePath, and 'login'
# or 'welcome' as the route name of goNamed, pushNamed, namedLocation and
# the other named navigation calls. Not caught: a path assembled at run time ('/' + 'login', or
# interpolation such as '/$name').
id: auth-navigation-only-in-router
language: dart
severity: error
files:
  - app/**
ignores:
  - app/lib/app/router.dart
  - app/test/**
rule:
  any:
    - kind: string_literal
      regex: '^r?[''"]/(?:login|welcome)(?:[/?#''"])'
    - kind: identifier
      regex: '^(?:loginPath|welcomePath)$'
    - kind: string_literal
      regex: '^r?[''"](?:login|welcome)[''"]$'
      inside:
        kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            regex: '(?:^|\.)\s*(?:go|push|pushReplacement|replace|popAndPush|pushNamedAndRemoveUntil|namedLocation)(?:Named)?$'
message: 'The sign-in or onboarding route is named outside authRedirect: change the session state (SessionCubit) and let authRedirect in app/lib/app/router.dart route the user'
