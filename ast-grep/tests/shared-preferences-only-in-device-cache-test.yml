id: shared-preferences-only-in-device-cache
valid:
  # The app goes through DeviceCache (the real main.dart since c4ed2e4).
  - |
    Future<void> main() async {
      final cache = DeviceCache.onDevice();
      runApp(App(cache: cache));
    }
  # A type is not a store.
  - |
    class Settings(final SharedPreferencesAsync prefs);
  # The package import names it in a string.
  - |
    import 'package:shared_preferences/shared_preferences.dart';
invalid:
  # The historical main.dart (c4ed2e4^:app/lib/main.dart:49).
  - |
    Future<void> main() async {
      final cache = DeviceCache(SharedPreferencesAsync());
      runApp(App(cache: cache));
    }
  - |
    Future<void> rememberTheme(bool dark) async {
      final prefs = await SharedPreferences.getInstance();
      await prefs.setBool('dark', dark);
    }
  - |
    final prefs = await SharedPreferencesWithCache.create(cacheOptions: options);
