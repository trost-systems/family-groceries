id: no-hardcoded-ui-text
valid:
  - |
    Widget build(BuildContext context) => Text(AppLocalizations.of(context).addItemHint);
  # Interpolated data, punctuation and digits are not language.
  - |
    Widget tile(Item item) => ListTile(title: Text('${item.quantity}× ${item.name}'), trailing: const Text('·'));
  - |
    final count = Text('$n');
  # Keys, routes, asset paths and URLs.
  - |
    final field = TextField(key: const ValueKey('add-field'), restorationId: 'add');
  - |
    final logo = Image.asset('assets/icon.png', semanticLabel: l10n.logo);
  - |
    final link = Link(uri: Uri.parse('https://example.org/datenschutz'));
  - |
    final go = TextButton(onPressed: () => context.go('/settings'), child: Text(l10n.settings));
  # A constant that is not shown, or shown data.
  - |
    const _prefix = 'household.';
    final t = Text(item.name);
  - |
    class Fonts { static const family = 'Google Sans'; }
    final t = Text(l10n.title, style: TextStyle(fontFamily: Fonts.family));
  # A literal used as a condition or a switch pattern is not shown.
  - |
    final t = Text(kind == 'bought' ? l10n.bought : l10n.open);
  - |
    final t = Text(switch (kind) { 'bought' => l10n.bought, _ => l10n.open });
  # Keys, format patterns and arguments of other calls are data.
  - |
    final t = Text(json['name'] as String);
  - |
    final t = Text(DateFormat('dd.MM.', 'de').format(date));
  - |
    final t = Text({'kind': l10n.bought}['kind']!);
  - |
    final t = Text(items.firstWhere((i) => i.name == 'Milch').name);
  # A getter or list constant that is only data, and a closure's result.
  - |
    String get _table => 'items';
    const _kinds = ['bought', 'open'];
    final t = Text(l10n.count(_kinds.where((k) => k == kind).length), key: ValueKey(_table));
  - |
    String get _names => items.map((i) { return 'Nr. ${i.n}'; }).join();
    final t = Text(_names);
  # A toString override, while the file shows another value's toString().
  - |
    sealed class LoadState { @override String toString() => 'LoadState'; }
    Widget w(int n) => Text(n.toString());
invalid:
  # Assigned, a default parameter value, an enum constant's argument (job 12b).
  - |
    Widget w(bool ok) { String msg; if (ok) { msg = 'Gespeichert'; } else { msg = l10n.error; } return Text(msg); }
  - |
    class P { late final String _t; void init() { this._t = 'Titel'; } Widget build(BuildContext c) => Text(_t); }
  - |
    class Btn extends StatelessWidget { const Btn({this.caption = 'Speichern'}); final String caption; Widget build(BuildContext c) => Text(caption); }
  - |
    enum Cat { fruit('Obst'); const Cat(this.label); final String label; }
    Widget chip(Cat c) => Text(c.label);
  # A list, map, getter or function declared in the same file (job 12b).
  - |
    const _labels = ['Eins', 'Zwei'];
    final t = Text(_labels[0]);
  - |
    class P { static const _own = ['Statisch']; Widget build(BuildContext c) => Text(_own[0]); }
  - |
    const _m = {'a': 'Karte'};
    final t = Text(_m['a']!);
  - |
    String get _title => 'Getter';
    final t = Text(_title);
  - |
    class P { String get _t => 'Getter'; Widget build(BuildContext c) => Text(_t); }
  - |
    String _nr(int e) => 'Nr. $e';
    final t = Text(_nr(1));
  - |
    String _state(bool c) { if (c) { return 'Ja'; } return l10n.no; }
    final t = Text(_state(c));
  - |
    class P { final _field = 'Feld'; Widget build(BuildContext c) => Text(_field); }
  # Collection if and for elements (job 12b).
  - |
    final t = Text([if (c) 'Wenn'].first);
  - |
    final t = Text([if (c) l10n.yes else 'Sonst'].first);
  - |
    final t = Text([for (final i in items) 'Eins'].first);
  # Through a receiver, an index target or a collection (review 1).
  - |
    final t = Text('Hallo'.toUpperCase());
  - |
    final t = Text(['Eins', 'Zwei'][c]);
  - |
    final t = Text(<String>['Eins'].join(', '));
  - |
    final t = Text(n ?? 'Lea'.toString());
  - |
    final t = Text({'k': 'Wert'}[k]!);
  - |
    final d = showDatePicker(context: context, confirmText: 'Übernehmen', firstDate: a, lastDate: b);
  # Two states in a ternary, a fallback, a concatenation, a switch arm.
  - |
    final t = Text(done ? 'Erledigt' : l10n.open);
  - |
    final t = Text(done ? l10n.done : 'Offen');
  - |
    final t = Tooltip(message: name ?? 'Unbenannt', child: icon);
  - |
    final t = Text(count.toString() + ' Stück');
  - |
    final t = Text((('Klammer')));
  - |
    final t = Text(switch (kind) { 'bought' => 'Gekauft', _ => l10n.open });
  - |
    const _done = 'Erledigt';
    final t = Text(done ? _done : l10n.open);
  # A constant in the same file is the same literal.
  - |
    const _title = 'Einkaufsliste';
    Widget build(BuildContext context) => const Text(_title);
  - |
    class _Labels { static const delete = 'Löschen'; }
    final tip = IconButton(tooltip: _Labels.delete, onPressed: delete);
  - |
    Widget build(BuildContext context) {
      const hint = 'Was fehlt?';
      return TextField(decoration: const InputDecoration(hintText: hint));
    }
  - |
    Widget build(BuildContext context) => const Text('Einkaufsliste');
  - |
    final hint = TextField(decoration: InputDecoration(hintText: 'Was fehlt?'));
  - |
    final tip = IconButton(tooltip: "Löschen", icon: const Icon(Icons.delete), onPressed: delete);
  - |
    void undo(ScaffoldMessengerState m) => m.showSnackBar(SnackBar(content: Text('$name gekauft')));
  - |
    final dialog = AlertDialog(title: Text("Haushalt verlassen?"));
  - |
    final span = TextSpan(text: 'Neu');
  - |
    final sheet = showModalBottomSheet(context: context, builder: (c) => Text('Mehr'));
