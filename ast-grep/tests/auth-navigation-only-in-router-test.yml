id: auth-navigation-only-in-router
valid:
  # Other routes are fine.
  - |
    void open(BuildContext context) => context.go(listPath);
  - |
    void open(BuildContext context) => context.push(settingsPath);
  - |
    void join(GoRouter router, String code) => router.go(joinPath(code));
  # Signing out goes through the session; the router redirects.
  - |
    Future<void> signOut(BuildContext context) => context.read<SessionCubit>().signOut();
  # A path that only starts with the same letters.
  - |
    void open(BuildContext context) => context.go('/loginhelp');
  # A route name other than the auth routes, and 'login' as plain data.
  - |
    void open(BuildContext context) => context.goNamed('settings');
  - |
    final event = track('login');
  - |
    void log(Analytics a) => a.logEventNamed('login');
invalid:
  # By route name, through a constant, a static Navigator call, a Uri (job 12b).
  - |
    void back(BuildContext context) => context.goNamed('login');
  - |
    final where = GoRouter.of(context).namedLocation('welcome');
  - |
    void back(BuildContext context) => context.pushReplacementNamed("welcome", queryParameters: q);
  - |
    void back(BuildContext context) => Navigator.pushNamed(context, '/login');
  - |
    const _p = '/login';
    void back(BuildContext context) => context.go(_p);
  - |
    void back(BuildContext context) => context.go(Uri(path: '/welcome', queryParameters: q).toString());
  - |
    Future<void> signOut(BuildContext context) async {
      await Supabase.instance.client.auth.signOut();
      context.go('/login');
    }
  - |
    void leave(BuildContext context) => context.go(welcomePath);
  - |
    void leave(BuildContext context) => GoRouter.of(context).go('/welcome?invite=AB');
  - |
    void back(BuildContext context) => context.pushReplacement(loginPath);
  - |
    void back(BuildContext context) => Navigator.of(context).pushNamed('/login');
  - |
    void back(GoRouter router) => router.replace("/welcome");
