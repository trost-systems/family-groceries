# Keeps the free Supabase project from pausing: Supabase pauses a Free plan project after 7 days
# of too little database activity (docs/DECISIONS.md, job 13). One daily read through the health
# function, which queries Postgres. Fails the run if the project or its database doesn't answer.
name: Keepalive

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 'Keepalive failed'
    steps:
      - name: Read from Postgres through the health function
        id: health
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Repository variable SUPABASE_PROJECT_REF is missing; nothing was checked."
            exit 1
          fi
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/health"
          code=$(curl -sS --max-time 30 --retry 3 --retry-delay 10 --retry-connrefused \
            -o health.json -w '%{http_code}' "$url") || true
          if [ "$code" != 200 ] || ! jq -e '.database == true' health.json >/dev/null 2>&1; then
            echo "::error::$url answered HTTP ${code:-none}: $(head -c 300 health.json 2>/dev/null). If the project is paused, resume it in the Supabase dashboard (docs/DEPLOY.md)."
            exit 1
          fi
          echo "Postgres answered through $url"
      # GitHub disables scheduled workflows in a public repo after 60 days without repository
      # activity. Best effort: GitHub doesn't document that this restarts the clock; pushes to main
      # re-enable it for sure (ci.yml keepalive-schedule, docs/DEPLOY.md).
      - name: Keep this schedule enabled
        id: enable
        if: ${{ !cancelled() }}
        run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
      # Failure mails for scheduled runs go to whoever last edited the cron line (the bot), so a
      # failure is reported as one open issue instead, and the next green run closes it.
      - name: Report the failure in an issue
        if: failure()
        env:
          HEALTH: ${{ steps.health.outcome }}
          ENABLE: ${{ steps.enable.outcome }}
        run: |
          body="Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed. Database read through health: $HEALTH. Re-enabling the schedule: $ENABLE. docs/DEPLOY.md, section Keepalive, says what to do."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE))[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          fi
      - name: Close the failure issue
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID is green again."
          done
