# Signing material in the match repo (docs/RELEASE.md), one lane per dispatch:
#   certificates   create or renew the App Store distribution certificate and
#                  profile (`fastlane ios certificates`); confirm "create"
#   renew_profile  new profiles with the existing certificate after a
#                  capability change, never a certificate; confirm "renew"
#   profiles       list the App IDs' profiles and their states; read-only
# match imports into a macOS keychain, so the lanes need a Mac; this runs them
# on a GitHub macOS runner instead of Peter's Mac.
#
# Manual only (Actions tab, Certificates, Run workflow) and only from `main`.
# It has no push or pull_request trigger, so code from a fork or a PR never
# runs with the `release` environment's secrets. Apple allows only a few
# distribution certificates per team: run it once, and again only to renew.
name: Certificates

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Lane to run
        type: choice
        options: [certificates, renew_profile, profiles]
        default: certificates
      confirm:
        description: Type "create" (certificates) or "renew" (renew_profile); profiles needs none
        type: string
        required: false
      match_types:
        description: Profile types for renew_profile (appstore or appstore,adhoc)
        type: string
        default: appstore

concurrency:
  group: certificates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certificates:
    if: >-
      github.ref == 'refs/heads/main'
      && ((inputs.lane == 'certificates' && inputs.confirm == 'create')
          || (inputs.lane == 'renew_profile' && inputs.confirm == 'renew')
          || inputs.lane == 'profiles')
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check the secrets
        working-directory: .
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL || secrets.MATCH_GIT_URL }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        # Prints only the names of missing values, never a value.
        run: |
          missing=()
          for name in APPLE_TEAM_ID MATCH_GIT_URL MATCH_DEPLOY_KEY MATCH_PASSWORD \
            APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing ${missing[*]} in the release environment (docs/NEEDS_PETER.md, Job 4: release)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # No Actions cache in a job with the signing secrets: any run on main can write an entry
      # that this job would unpack and run (job 220).
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: app
      - name: Install the gems from the lockfile
        run: |
          bundle config set --local deployment true
          bundle install --jobs 4
      # match clones and pushes the private certificates repo over SSH.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      # A throwaway keychain, so the import never waits on a login keychain
      # prompt. The runner is discarded after the job.
      - name: Create a temporary keychain
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          keychain="$RUNNER_TEMP/match.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '" ')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          {
            echo "MATCH_KEYCHAIN_NAME=$keychain"
            echo "MATCH_KEYCHAIN_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - run: bundle exec fastlane ios "$LANE"
        env:
          LANE: ${{ inputs.lane }}
          MATCH_TYPES: ${{ inputs.match_types }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL || secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
