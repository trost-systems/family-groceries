# Deploys migrations and edge functions to the hosted project from main, over HTTPS only:
# migrations through the Management API (supabase/deploy/migrate.ts), functions bundled by
# Supabase (--use-api). No Postgres connection and no Docker. A missing credential fails the run.
# Every deploy ends with scripts/smoke-remote.sh. Dispatching with `ref` redeploys only the edge
# functions of that earlier main commit and smoke-tests them; migrations stay forward-only
# (docs/DEPLOY.md).
name: Supabase deploy

on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/smoke-remote.sh', 'scripts/mcp-smoke.sh', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rollback: redeploy only the edge functions of this earlier main commit (SHA). Empty deploys main, migrations included.'
        required: false
        default: ''

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
      ROLLBACK_REF: ${{ inputs.ref }}
    steps:
      - name: Check deploy credentials
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing secret SUPABASE_ACCESS_TOKEN,"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing variable SUPABASE_PROJECT_REF,"
          if [ -n "$missing" ]; then
            echo "::error::Nothing was deployed. Missing:${missing%,} (docs/NEEDS_PETER.md, section 1)."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Deploys run from main only, not $GITHUB_REF. Roll back with the ref input on main."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check out the rollback commit
        if: ${{ inputs.ref }}
        run: |
          if ! [[ $ROLLBACK_REF =~ ^[0-9a-f]{7,40}$ ]] || ! sha=$(git rev-parse --verify --quiet "$ROLLBACK_REF^{commit}"); then
            echo "::error::$ROLLBACK_REF is not a commit SHA in this repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; only reviewed main commits can be redeployed."
            exit 1
          fi
          # Older commits predate the smoke test (their health never queried Postgres).
          if ! git cat-file -e "$sha:scripts/smoke-remote.sh" 2>/dev/null; then
            echo "::error::$sha predates scripts/smoke-remote.sh (job 13), so it can't be smoke-tested. Fix forward instead (docs/DEPLOY.md)."
            exit 1
          fi
          git checkout --quiet --detach "$sha"
          echo "Rollback of the edge functions to \`$sha\`; migrations skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Rollback: redeploying the edge functions of $sha; migrations are skipped."
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Migrations
        if: ${{ !inputs.ref }}
        run: deno run --allow-read --allow-env --allow-net --config supabase/deploy/deno.json supabase/deploy/migrate.ts
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Edge functions
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Record the deployed commit
        run: echo "Edge functions deployed from \`$(git rev-parse HEAD)\`." >> "$GITHUB_STEP_SUMMARY"
      # Retries for about half a minute: a fresh deploy can take a few seconds to replace the old
      # version everywhere.
      - name: Smoke test
        run: |
          for attempt in 1 2 3; do
            scripts/smoke-remote.sh "https://$SUPABASE_PROJECT_REF.supabase.co" && exit 0
            echo "attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          echo "::error::The smoke test failed after the deploy (scripts/smoke-remote.sh). docs/DEPLOY.md says how to roll back."
          exit 1
