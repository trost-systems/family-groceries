# Google Play refunds (job 25, docs/PURCHASES.md): once a day the purchases function asks Play's
# Voided Purchases API for the last 7 days and takes the unlock away from each refunded or charged
# back Hummlist Lifetime purchase (purchase_refunded once). Real-time developer notifications would
# need Pub/Sub, which needs Cloud billing (not allowed, DECISIONS 25.8), hence the poll.
# Skips cleanly until the Lead has set the repository secret PURCHASES_CRON_SECRET (the same value
# as the function secret, NEEDS_LEAD Job 25). The function answers 503 until Google is configured.
name: Purchases voided poll

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

concurrency:
  group: purchases-voided
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CRON_SECRET: ${{ secrets.PURCHASES_CRON_SECRET }}
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 'Purchases voided poll failed'
    steps:
      - name: Ask the purchases function to apply Play's voided purchases
        id: poll
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "PURCHASES_CRON_SECRET or SUPABASE_PROJECT_REF is not set yet (NEEDS_LEAD Job 25); nothing to poll."
            exit 0
          fi
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/purchases/google/voided"
          code=$(curl -sS --max-time 60 --retry 2 --retry-delay 15 -o voided.json -w '%{http_code}' \
            -X POST -H "authorization: Bearer $CRON_SECRET" "$url") || true
          if [ "$code" = 503 ]; then
            echo "The function is not configured for Google yet: $(head -c 200 voided.json)"
            exit 0
          fi
          if [ "$code" != 200 ]; then
            echo "::error::$url answered HTTP ${code:-none}: $(head -c 300 voided.json)"
            exit 1
          fi
          echo "Voided purchases: $(cat voided.json)"
      - name: Report the failure in an issue
        if: failure()
        run: |
          body="Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed. Refunded Play purchases may still unlock households. docs/PURCHASES.md, section Refunds, says what to do."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE))[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          fi
      - name: Close the failure issue
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID is green again."
          done
