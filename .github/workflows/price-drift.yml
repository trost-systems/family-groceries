# Checks daily that the App Store and Google Play still charge what scripts/iap/product.ts
# expectedPrices says for Hummlist Premium yearly and Lifetime (job 49): read-only API calls by
# scripts/iap/price_drift.ts. A drift (or a store API error) fails the run and opens or updates an
# issue. It needs the repository secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8's text)
# and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON (NEEDS_LEAD "Job 49"); until they are set the run says
# SKIPPED and fails with exit 2, without an issue.
name: Store price drift

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: price-drift
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 'Store prices drifted from scripts/iap/product.ts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Compare the stores' prices with product.ts
        id: drift
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then
            umask 077
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
            export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          else
            echo "SKIPPED: repository secret ASC_KEY_P8 missing (NEEDS_LEAD Job 49)"
          fi
          unset ASC_KEY_P8
          code=0
          deno run --allow-env --allow-read --allow-net scripts/iap/price_drift.ts --require || code=$?
          rm -f "$RUNNER_TEMP/asc.p8"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 2 ]; then
            echo "::error::Store secrets missing: the prices were not checked (NEEDS_LEAD Job 49)."
          fi
          exit "$code"
      - name: Report the drift in an issue
        if: failure() && steps.drift.outputs.code == '1'
        run: |
          body="Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID found store prices that differ from expectedPrices in scripts/iap/product.ts, or could not read them (the FAIL lines in its log). Fix the price in the store, or change expectedPrices if the new price is intended."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE))[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          fi
      - name: Close the drift issue
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID found no drift."
          done
