# Every gate a PR must pass. ci-ok is the single required check.
# Structure (concurrency, SHA-pinned actions, ci-ok gate) follows trost-systems/emotely.
# Each job installs tools and runs one scripts/gates/<job>.sh, the script scripts/verify.sh runs
# locally too (scripts/check-gates.sh keeps it that way). Measurements: docs/CI.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8
  SUPABASE_CLI_VERSION: 2.121.0
  GITLEAKS_VERSION: 8.30.1
  ACTIONLINT_VERSION: 1.7.12
  AST_GREP_VERSION: 0.51.0
  SQUAWK_VERSION: 2.70.0
  # Where the CLI pulls the Supabase images. public.ecr.aws (its default) answered runners
  # "toomanyrequests" (job 11), and so did ghcr.io for hours on 2026-10-27, also with a token
  # login; Docker Hub pulled every image (DECISIONS job 15b).
  SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io

jobs:
  # Which gates this change needs (scripts/ci-changes.sh): docs-only changes skip the heavy
  # gates, android/ios need app/, fastlane needs app/fastlane or the Gemfile.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      native: ${{ steps.filter.outputs.native }}
      fastlane: ${{ steps.filter.outputs.fastlane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      # A pull_request checkout is the merge commit, whose first parent is the base.
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - run: scripts/gates/gitleaks.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # actionlint for the workflows; ast-grep and squawk for scripts/lint.sh (job 12).
      - name: Install actionlint, ast-grep and squawk
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          curl -fsSL -o /tmp/ast-grep.zip "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          sudo unzip -o -q /tmp/ast-grep.zip ast-grep -d /usr/local/bin
          sudo curl -fsSL -o /usr/local/bin/squawk "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/squawk-linux-x64"
          sudo chmod +x /usr/local/bin/squawk
      - run: scripts/gates/lint.sh

  # Job 39: the PR's `## Changelog` section (docs/CHANGELOG.md), on pull requests only. Dependabot
  # PRs carry none and need none: their bumps are no user-visible change.
  changelog:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - run: scripts/gates/changelog.sh

  db:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Job 27: the setup lives in a composite action that e2e.yml's db job runs too.
      - uses: ./.github/actions/db-setup
        with:
          supabase-cli-version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: scripts/gates/db.sh

  functions:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: scripts/gates/functions.sh

  # The guides site (site/, job 24a). Always runs: guide content is Markdown, which
  # ci-changes.sh counts as documentation.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: scripts/gates/site.sh

  fg-cli:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: scripts/gates/fg-cli.sh

  flutter:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/flutter.sh

  web-prod:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/web-prod.sh

  # Playwright is the critical path, so the suite runs as two shards, each with its own stack.
  # Job 27: the steps before and after the gate are composite actions that the on-demand e2e.yml
  # runs too (docs/CI.md, On-demand e2e).
  e2e:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Job 18: the fg sync smoke test (shard 1) stacks the client videos with ffmpeg.
      - uses: ./.github/actions/e2e-setup
        with:
          supabase-cli-version: ${{ env.SUPABASE_CLI_VERSION }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          ffmpeg: ${{ matrix.shard == 1 }}
      - run: scripts/gates/e2e.sh --shard=${{ matrix.shard }}/2
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/e2e/screenshots
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/e2e-report
        with:
          job-status: ${{ job.status }}
          artifact-name: playwright-${{ matrix.shard }}
          results-name: e2e-results-${{ matrix.shard }}

  # Job 4 (release): the Gemfile.lock installs and the Fastfile parses.
  fastlane:
    needs: changes
    if: needs.changes.outputs.fastlane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: app
          bundler-cache: true
      - run: scripts/gates/fastlane.sh

  # Job 4b: the app's own Kotlin and Swift (the on-device speech check) compile.
  android:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
      # The NDK (flutter.ndkVersion of this Flutter) and CMake the build installs on first use.
      # Only these two: the runner's preinstalled NDKs are several GB.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-28.2.13676358-cmake-3.22.1-${{ runner.os }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/android.sh

  ios:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/ios.sh

  # Job 13: GitHub never turns a schedule back on that it disabled for 60 days of inactivity, so
  # every push to main re-enables the keepalive (docs/DEPLOY.md, Keepalive). Job 13b: and the
  # nightly backup (docs/BACKUP.md). Job 23: and the release, whose per-merge workflow_run
  # trigger stops too while it is disabled (docs/RELEASE.md).
  keepalive-schedule:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh workflow enable backup.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh workflow enable release.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  ci-ok:
    needs: [changes, gitleaks, lint, changelog, db, functions, site, fg-cli, flutter, web-prod, e2e, fastlane, android, ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
