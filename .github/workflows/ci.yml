# Every gate a PR must pass. ci-ok is the single required check.
# Structure (concurrency, SHA-pinned actions, ci-ok gate) follows trost-systems/emotely.
# Each job installs tools and runs one scripts/gates/<job>.sh, the script scripts/verify.sh runs
# locally too (scripts/check-gates.sh keeps it that way). Measurements: docs/CI.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  SUPABASE_CLI_VERSION: 2.121.0
  GITLEAKS_VERSION: 8.30.1
  ACTIONLINT_VERSION: 1.7.12
  AST_GREP_VERSION: 0.51.0
  SQUAWK_VERSION: 2.70.0
  # The CLI's default registry (public.ecr.aws) answers "toomanyrequests" to runners and the CLI
  # falls back to ghcr.io after ~14 s of retries on every run.
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io

jobs:
  # Which gates this change needs (scripts/ci-changes.sh): docs-only changes skip the heavy
  # gates, android/ios need app/, fastlane needs app/fastlane or the Gemfile.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      native: ${{ steps.filter.outputs.native }}
      fastlane: ${{ steps.filter.outputs.fastlane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      # A pull_request checkout is the merge commit, whose first parent is the base.
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - run: scripts/gates/gitleaks.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # actionlint for the workflows; ast-grep and squawk for scripts/lint.sh (job 12).
      - name: Install actionlint, ast-grep and squawk
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          curl -fsSL -o /tmp/ast-grep.zip "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip"
          sudo unzip -o -q /tmp/ast-grep.zip ast-grep -d /usr/local/bin
          sudo curl -fsSL -o /usr/local/bin/squawk "https://github.com/sbdchd/squawk/releases/download/v${SQUAWK_VERSION}/squawk-linux-x64"
          sudo chmod +x /usr/local/bin/squawk
      - run: scripts/gates/lint.sh

  db:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Supabase binds 54320-54329, inside Linux's default ephemeral range
      # (32768-60999); an outbound socket on the runner can already hold one.
      - name: Keep ephemeral ports clear of the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      - run: scripts/gates/db.sh

  functions:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: scripts/gates/functions.sh

  fg-cli:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: scripts/gates/fg-cli.sh

  flutter:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/flutter.sh

  web-prod:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/web-prod.sh

  # Playwright is the critical path, so the suite runs as two shards, each with its own stack.
  e2e:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Supabase binds 54320-54329, inside Linux's default ephemeral range
      # (32768-60999); an outbound socket on the runner can already hold one.
      - name: Keep ephemeral ports clear of the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      # Pulls and starts the stack while the next steps install Flutter and Playwright; the gate's
      # supabase_up (scripts/lib.sh) waits on the same lock and reuses it.
      - name: Start the local Supabase stack in the background
        run: |
          (source scripts/lib.sh && supabase_up) >/tmp/supabase-start.log 2>&1 &
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # The runner image already has the libraries headless Chromium needs. install-deps (apt:
      # fonts, xvfb) took 6 min on a slow mirror once, so it runs only when a launch fails.
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium
          node -e "import('@playwright/test').then(({ chromium }) => chromium.launch()).then((b) => b.close())" \
            || npx playwright install --with-deps chromium
      - run: scripts/gates/e2e.sh --shard=${{ matrix.shard }}/2
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/e2e/screenshots
      - name: Supabase start log
        if: failure()
        run: cat /tmp/supabase-start.log
      # Job 4b: a 503 from an Edge Function comes from the edge runtime, whose log says why.
      - name: Edge runtime log
        if: failure()
        run: docker logs "$(docker ps -qf name=supabase_edge_runtime)" 2>&1 | tail -n 300
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/screenshots
          retention-days: 14

  # Job 4 (release): the Gemfile.lock installs and the Fastfile parses.
  fastlane:
    needs: changes
    if: needs.changes.outputs.fastlane == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: app
          bundler-cache: true
      - run: scripts/gates/fastlane.sh

  # Job 4b: the app's own Kotlin and Swift (the on-device speech check) compile.
  android:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/gradle/wrapper/gradle-wrapper.properties
      # The NDK (flutter.ndkVersion of this Flutter) and CMake the build installs on first use.
      # Only these two: the runner's preinstalled NDKs are several GB.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-ndk-28.2.13676358-cmake-3.22.1-${{ runner.os }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/android.sh

  ios:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: scripts/gates/ios.sh

  # Job 13: GitHub never turns a schedule back on that it disabled for 60 days of inactivity, so
  # every push to main re-enables the keepalive (docs/DEPLOY.md, Keepalive).
  keepalive-schedule:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  ci-ok:
    needs: [changes, gitleaks, lint, db, functions, fg-cli, flutter, web-prod, e2e, fastlane, android, ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
