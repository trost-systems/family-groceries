# Nightly encrypted backup of the hosted database (docs/BACKUP.md). pg_dump of the data in public
# plus auth.users and auth.identities through the session pooler (the direct host is IPv6-only,
# runners have no IPv6), encrypted with age to the recipient in supabase/backup/recipient.txt,
# kept as a 90-day artifact. The repo is public, so only ciphertext is uploaded.
name: Backup

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: 'Database backup failed'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the database password secret
        id: secret
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::Repository secret SUPABASE_DB_PASSWORD is missing or empty; nothing was backed up (docs/BACKUP.md)."
            exit 1
          fi
      - name: Install pg_dump 17 and age
        id: tools
        run: scripts/backup/install-tools.sh
      - name: Dump and encrypt
        id: dump
        env:
          PGHOST: aws-1-eu-central-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.${{ vars.SUPABASE_PROJECT_REF }}
          PGDATABASE: postgres
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '30'
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          name="db-backup-$(date -u +%Y-%m-%d)-$GITHUB_RUN_ID"
          mkdir -p "$RUNNER_TEMP/backup"
          scripts/backup/dump.sh supabase/backup/recipient.txt "$RUNNER_TEMP/backup/$name.sql.age"
          echo "name=$name" >>"$GITHUB_OUTPUT"
      - name: Upload the encrypted dump
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dump.outputs.name }}
          path: ${{ runner.temp }}/backup/${{ steps.dump.outputs.name }}.sql.age
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
      # Failure mails for scheduled runs go to whoever last edited the cron line (the bot), so a
      # failure is reported as one open issue instead, and the next green run closes it.
      - name: Report the failure in an issue
        if: failure()
        env:
          SECRET: ${{ steps.secret.outcome }}
          TOOLS: ${{ steps.tools.outcome }}
          DUMP: ${{ steps.dump.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          body="Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed, so there is no backup from tonight. Password secret: $SECRET. pg_dump and age: $TOOLS. Dump and encrypt: $DUMP. Upload: $UPLOAD. docs/BACKUP.md, section Failures, says what to do."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE))[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          fi
      - name: Close the failure issue
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 500 --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID backed up the database again."
          done
