# Ships every green commit on main to the internal testers: iOS to TestFlight (internal group
# only), Android to the Play internal track. It starts when CI succeeds on a push to main and
# ships the newest green main commit; docs/RELEASE.md describes the run, the lanes are in
# app/fastlane/Fastfile, the decisions in scripts/release/. Only a dispatch moves the web app
# (app.hummlist.com). There is no public store release here (no production track, no App Store
# review). A platform whose secrets are missing is skipped with a notice; a failed automatic run
# opens or comments on the "Internal release failed" issue.
name: Release

on:
  # A finished CI run on main. Only a green push run of this repository starts the plan (job
  # `if` below): a red one, a PR from a fork whose branch is named main, or a dispatched CI run
  # leaves every job skipped.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Mondays 03:00 UTC, a catch-up: ships nothing when the testers have the newest green main,
  # but re-ships before TestFlight's 90-day expiry or after Apple expired the builds.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      platform:
        description: Store to ship to
        type: choice
        options: [both, ios, android]
        default: both
      upload:
        description: Upload (off = build, sign and validate only)
        type: boolean
        default: true
      force:
        description: Ship even if the testers already have this app
        type: boolean
        default: false
      simulate_failure:
        description: Fail on purpose to test the failure issue
        type: boolean
        default: false

# One run at a time and never cancelled mid-upload. GitHub keeps one pending run and cancels an
# older pending one when a newer arrives; that is fine, every run ships the newest green commit.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# `shell: bash` adds -o pipefail, so `plan.sh ... | tee` fails when plan.sh does.
defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: 3.47.8
  # Build number = offset + run number, the same on both stores. When the schedule started,
  # TestFlight's highest was 1002 and Play's first, hand-uploaded bundle was 1003 (docs/RELEASE.md);
  # raise the offset if a store ever holds a higher one.
  BUILD_NUMBER_OFFSET: 1010
  # SHA-256 of the upload certificate in ANDROID_KEYSTORE_BASE64 (docs/RELEASE.md).
  UPLOAD_CERT_SHA256: 2C:9B:48:6D:AF:1B:94:AB:3F:92:38:49:CC:0F:C3:42:EF:09:64:2C:32:40:74:97:69:25:61:74:0C:BA:84:F5
  PLAY_WORKLOAD_IDENTITY_PROVIDER: projects/1023711338330/locations/global/workloadIdentityPools/github/providers/family-groceries
  PLAY_SERVICE_ACCOUNT: play-release@family-groceries-ci.iam.gserviceaccount.com

jobs:
  # Environment secrets are visible only to jobs in the environment, so the plan runs in
  # `release` too (main only).
  plan:
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      actions: read
    outputs:
      ship: ${{ steps.decide.outputs.ship }}
      blocked: ${{ steps.decide.outputs.blocked }}
      reason: ${{ steps.decide.outputs.reason }}
      current: ${{ steps.decide.outputs.current }}
      # The commit this run builds: main's tip for a dispatch, else the newest green main commit.
      sha: ${{ steps.decide.outputs.sha }}
      upload: ${{ steps.inputs.outputs.upload }}
      ios: ${{ steps.secrets.outputs.ios }}
      android: ${{ steps.secrets.outputs.android }}
      build_number: ${{ steps.inputs.outputs.build_number }}
      notes_de: ${{ steps.notes.outputs.de }}
      notes_en: ${{ steps.notes.outputs.en }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # A workflow_run or scheduled run has no inputs; it gets the dispatch defaults here, so
      # every event takes the same path from this step on.
      - id: inputs
        env:
          PLATFORM: ${{ inputs.platform || 'both' }}
          UPLOAD: ${{ inputs.upload }}
          FORCE: ${{ inputs.force }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          upload="${UPLOAD:-true}" force="${FORCE:-false}"
          {
            echo "platform=$PLATFORM"
            echo "upload=$upload"
            echo "force=$force"
            echo "build_number=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))"
          } | tee -a "$GITHUB_OUTPUT"
          echo "Release plan ($GITHUB_EVENT_NAME): platform=$PLATFORM upload=$upload force=$force" \
            "main=$GITHUB_SHA trigger=${TRIGGER_SHA:-none}"
      - name: Simulate a failure
        if: inputs.simulate_failure
        run: |
          echo "::error::simulate_failure is set: failing on purpose to test the failure issue."
          exit 1
      - id: secrets
        env:
          PLATFORM: ${{ steps.inputs.outputs.platform }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL || secrets.MATCH_GIT_URL }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          check() {
            local platform="$1"; shift
            if [ "$PLATFORM" != both ] && [ "$PLATFORM" != "$platform" ]; then
              echo "$platform=false" >> "$GITHUB_OUTPUT"
              return
            fi
            local missing=()
            for name in "$@"; do
              [ -n "${!name}" ] || missing+=("$name")
            done
            if [ ${#missing[@]} -eq 0 ]; then
              echo "$platform=true" >> "$GITHUB_OUTPUT"
            else
              echo "$platform=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$platform release skipped: missing ${missing[*]} (docs/RELEASE.md)."
            fi
          }
          check ios APPLE_TEAM_ID MATCH_GIT_URL MATCH_DEPLOY_KEY MATCH_PASSWORD \
            APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8
          check android ANDROID_KEYSTORE_BASE64 ANDROID_KEY_PROPERTIES
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: steps.secrets.outputs.ios == 'true'
        with:
          working-directory: app
          bundler-cache: true
      - name: Check the profile and read TestFlight's builds
        if: steps.secrets.outputs.ios == 'true'
        working-directory: app
        env:
          TESTFLIGHT_JSON: ${{ runner.temp }}/testflight.json
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: bundle exec fastlane ios preflight
      # A dispatch ships the commit it was started on. Any other run starts from main as it is
      # now, which may be past the commit whose CI started it (github.sha is main's tip when the
      # run was created).
      - name: Gather the facts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ steps.inputs.outputs.force }}
          UPLOAD: ${{ steps.inputs.outputs.upload }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_NUMBER: ${{ steps.inputs.outputs.build_number }}
          TESTFLIGHT_JSON: ${{ runner.temp }}/testflight.json
        run: |
          main="$GITHUB_SHA"
          if [ "$EVENT" != workflow_dispatch ]; then
            git fetch -q origin main
            main="$(git rev-parse origin/main)"
          fi
          MAIN_SHA="$main" scripts/release/plan.sh gather | tee "$RUNNER_TEMP/facts.json"
      - id: decide
        run: |
          if ! scripts/release/plan.sh decide "$RUNNER_TEMP/facts.json" > "$RUNNER_TEMP/decision"; then
            cat "$RUNNER_TEMP/decision"
            exit 1
          fi
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/decision"
          reason="$(sed -n 's/^reason=//p' "$RUNNER_TEMP/decision")"
          if grep -qx ship=true "$RUNNER_TEMP/decision"; then
            echo "::notice::Shipping build $((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER)): $reason"
          else
            echo "::notice::Release skipped: $reason"
          fi
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"
      - id: notes
        if: steps.decide.outputs.ship == 'true'
        env:
          PREVIOUS: ${{ steps.decide.outputs.previous_sha }}
          SHA: ${{ steps.decide.outputs.sha }}
        run: |
          eof="NOTES_$(openssl rand -hex 8)"
          for lang in de en; do
            { echo "$lang<<$eof"; scripts/release/notes.sh "$lang" "$PREVIOUS" "$SHA"; echo "$eof"; } >>"$GITHUB_OUTPUT"
          done
          scripts/release/notes.sh de "$PREVIOUS" "$SHA"

  ios:
    needs: plan
    if: needs.plan.outputs.ship == 'true' && needs.plan.outputs.ios == 'true'
    # App Store Connect only accepts builds from the current Xcode SDK.
    runs-on: macos-26
    timeout-minutes: 100
    environment: release
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      RELEASE_UPLOAD: ${{ needs.plan.outputs.upload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          working-directory: app
          bundler-cache: true
      # match clones the private certificates repo over SSH.
      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}
      # The signing secrets go to the fastlane steps only, not to the third-party actions.
      - run: bundle exec fastlane ios beta
        env:
          # Analytics (job 19, docs/ANALYTICS.md): empty until Peter sets them, which keeps it off.
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          ANALYTICS_INTERNAL_HOUSEHOLDS: ${{ vars.ANALYTICS_INTERNAL_HOUSEHOLDS }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL || secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      - name: Wait for TestFlight processing
        if: needs.plan.outputs.upload == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          RELEASE_NOTES_DE: ${{ needs.plan.outputs.notes_de }}
          RELEASE_NOTES_EN: ${{ needs.plan.outputs.notes_en }}
          WAIT_MINUTES: '45'
        run: bundle exec fastlane ios wait_processing

  android:
    needs: plan
    if: needs.plan.outputs.ship == 'true' && needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: app
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    env:
      BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
      RELEASE_UPLOAD: ${{ needs.plan.outputs.upload }}
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          working-directory: app
          bundler-cache: true
      # key.properties names storeFile=../upload-keystore.jks, which resolves
      # from android/app to android/upload-keystore.jks.
      - name: Write the upload keystore
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
      - run: bundle exec fastlane android build
        env:
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          ANALYTICS_INTERNAL_HOUSEHOLDS: ${{ vars.ANALYTICS_INTERNAL_HOUSEHOLDS }}
      - name: Remove the upload keystore
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
      - run: ../scripts/release/check-aab.sh build/app/outputs/bundle/release/app-release.aab "$UPLOAD_CERT_SHA256"
      # For the first upload by hand (Play creates the app from it) and for inspection.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hummlist-${{ env.BUILD_NUMBER }}-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      # Keyless: GitHub's OIDC token for the release environment is exchanged for the service
      # account, which only Play Console grants anything to.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PLAY_SERVICE_ACCOUNT }}
      # PLAY_RELEASE_STATUS unset means the Play app is not set up yet (docs/NEEDS_LEAD.md):
      # the run checks access and reports instead of uploading. Once set (draft, then
      # completed), every run uploads, and a missing grant fails the run.
      - id: upload
        env:
          PLAY_ACCESS_FILE: ${{ runner.temp }}/play-access
        run: |
          if [ -z "$PLAY_RELEASE_STATUS" ]; then
            bundle exec fastlane android play_access
            access="$(cat "$PLAY_ACCESS_FILE")"
            if [ "$access" = ok ]; then
              echo "::notice::Play access works, but PLAY_RELEASE_STATUS is unset: no Play upload. Set it to draft (docs/NEEDS_LEAD.md, L3)."
            else
              echo "::notice::No Play upload: Play refuses the service account for com.hummlist.app ($access). docs/NEEDS_LEAD.md, L1-L4; the signed AAB is in this run's artifacts."
            fi
            exit 0
          fi
          bundle exec fastlane android internal
          if [ "$RELEASE_UPLOAD" = true ]; then echo "uploaded=true" >> "$GITHUB_OUTPUT"; fi

  # The plan job finds the last upload by this job's name, which carries the shipped commit; it
  # runs only after a real upload.
  uploaded:
    name: Uploaded ${{ needs.plan.outputs.sha }}
    needs: [plan, ios, android]
    if: >-
      !cancelled() && needs.plan.outputs.ship == 'true' && needs.plan.outputs.upload == 'true'
      && !contains(needs.*.result, 'failure')
      && (needs.ios.result == 'success' || needs.android.outputs.uploaded == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
          SHA: ${{ needs.plan.outputs.sha }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.outputs.uploaded == 'true' && 'uploaded' || needs.android.result }}
        run: |
          echo "Build $BUILD_NUMBER of $SHA: TestFlight $IOS, Play internal $ANDROID." | tee -a "$GITHUB_STEP_SUMMARY"

  # The web app ships with a dispatched store release only: app.hummlist.com is public and is
  # Vercel's production, whose branch is `release` (docs/DEPLOY.md, section "Web app"). The
  # automatic per-merge runs reach internal testers only, so they leave it alone. Moving `release`
  # to this run's commit makes Vercel build it and assign app.hummlist.com. A rerun of an older
  # run is a no-op, and the plain push only fast-forwards, so production never moves back from
  # here. Pushes to `main` build previews only (preview.app.hummlist.com, behind Vercel
  # Authentication). No branch protection or ruleset may block github-actions from pushing `release`.
  web:
    name: Web production
    needs: [plan, uploaded]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.uploaded.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Fast-forward the release branch
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          before="$(git rev-parse -q --verify origin/release || echo none)"
          # Already there, or release is already past this commit (a rerun of an older run).
          if [ "$before" != none ] && git merge-base --is-ancestor "$SHA" "$before"; then
            echo "release (${before:0:7}) already contains ${SHA:0:7}; production unchanged." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin "$SHA:refs/heads/release"
          echo "release: ${before:0:7} -> ${SHA:0:7}. Vercel builds it for app.hummlist.com." \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Not after a red or foreign CI run (plan skipped by its `if`): there is nothing to report.
  report:
    needs: [plan, ios, android, uploaded, web]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SIMULATE: ${{ inputs.simulate_failure || false }}
          UPLOAD: ${{ needs.plan.outputs.upload }}
          BLOCKED: ${{ needs.plan.outputs.blocked }}
          CURRENT: ${{ needs.plan.outputs.current }}
          REASON: ${{ needs.plan.outputs.reason }}
          SHA: ${{ needs.plan.outputs.sha }}
          PLAN: ${{ needs.plan.result }}
          IOS: ${{ needs.ios.result }}
          ANDROID: ${{ needs.android.result }}
          ANDROID_UPLOADED: ${{ needs.android.outputs.uploaded }}
          UPLOADED: ${{ needs.uploaded.result }}
          WEB: ${{ needs.web.result }}
        run: scripts/release/report.sh apply
