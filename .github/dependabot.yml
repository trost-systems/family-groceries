# Weekly dependency updates, one grouped PR per ecosystem, labelled for agents to pick up
# (gh pr list --label agent-ready). An agent lands one like any PR: check it out, verify,
# scripts/push-pr.sh, scripts/merge-pr.sh. Majors come as their own group so a breaking
# upgrade never hides in the routine one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    labels: [dependencies, agent-ready]
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    labels: [dependencies, agent-ready]
    groups:
      pub-minor:
        update-types: [minor, patch]
      pub-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    labels: [dependencies, agent-ready]
    groups:
      npm-minor:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
