name: hummel_hex_widgetbook
description: Widgetbook catalog for the Hummel Hex PoC (design job 41, preview only).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  hummel_hex_poc:
    path: ..
  widgetbook: 4.0.0-beta.14

dev_dependencies:
  build_runner: 2.16.2
  flutter_agent_lints: ^1.1.0
  flutter_test:
    sdk: flutter

flutter:
  # Material Icons for the "With icon" stories and Widgetbook's own UI.
  uses-material-design: true
