<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gemeinsame Einkaufsliste">
  <!-- Job 29e: the page behind the app (before its first frame) follows the
       device's light or dark setting, so a dark device does not flash white. -->
  <meta name="color-scheme" content="light dark">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hummlist">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon: the SVG follows the browser's light or dark setting, the PNG is the fallback. -->
  <link rel="icon" type="image/png" href="favicon.png" sizes="48x48"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Hummlist</title>
  <link rel="manifest" href="manifest.json">
  <!-- Job 52: the splash before Flutter's first frame, the mark on the surface colour in light
       and dark (generated by design/app-icon/build.mjs; flutter_bootstrap.js removes it). -->
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <div id="splash" aria-hidden="true"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
