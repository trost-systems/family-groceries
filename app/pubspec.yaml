name: family_groceries
description: "Gemeinsame Einkaufsliste"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  cupertino_icons: ^2.0.0
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.1
  google_sign_in_android: ^7.2.18
  google_sign_in_ios: ^6.3.8
  google_sign_in_platform_interface: ^3.1.0
  home_widget: ^0.10.0
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  posthog_flutter: 5.58.3
  purchases_flutter: ^11.0.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  shared_preferences_linux: ^2.4.1
  sign_in_with_apple: ^8.2.0
  speech_to_text: ^7.5.0
  stack_trace: ^1.12.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  visibility_detector: ^0.4.0+2
  web: ^1.1.2

dev_dependencies:
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  file: ^7.0.1
  flutter_agent_lints: ^1.1.0
  flutter_test:
    sdk: flutter
  marionette_flutter: ^0.7.0
  mocktail: ^1.0.4
  path_provider_linux: ^2.2.2
  shared_preferences_platform_interface: ^2.4.2
  speech_to_text_platform_interface: ^2.5.0
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/brand/
    - assets/fonts/OFL-BricolageGrotesque.txt
    - assets/fonts/OFL-Inter.txt
    # Design job 52: the fonts are bundled, never downloaded from a font service (OFL texts
    # above, registered with the LicenseRegistry in main.dart). Job 133: loadAppFonts registers
    # them before the first frame, as TrueType on devices and as WOFF2 on the web, where the
    # item icons' emoji also come along (scripts/app-fonts.sh writes both).
    - path: assets/fonts/BricolageGrotesque-Bold.ttf
      platforms: &native [android, ios, linux, macos, windows]
    - path: assets/fonts/BricolageGrotesque-ExtraBold.ttf
      platforms: *native
    - path: assets/fonts/Inter-Regular.ttf
      platforms: *native
    - path: assets/fonts/Inter-Medium.ttf
      platforms: *native
    - path: assets/fonts/Inter-SemiBold.ttf
      platforms: *native
    - path: assets/fonts/Inter-Bold.ttf
      platforms: *native
    - path: assets/fonts/web/
      platforms: [web]
