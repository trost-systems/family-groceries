# yaml-language-server: $schema=../scenario.schema.json
name: demo-household-en
summary: The English demo household „Our household“ (Anna and Jonas) of the en-US store screenshots and the English demo videos; the same list as demo-haushalt with English item names and generic English store names, eight weeks of weekly shops so "Due again" has rows.
goodFor:
  - the Play and App Store screenshots (scripts/store-screenshots.sh)
  - filming the demo videos (marketing/videos/capture)
  - a list in store sections with generic store names only
  - live sync between two members (anna, jonas)
users:
  - { handle: anna, name: Anna, locale: en }
  - { handle: jonas, name: Jonas, locale: en }
households:
  - name: Our household
    members: [anna, jonas]
    stores:
      - name: "Farmers' market"
      - name: Bakery
      - name: Supermarket
      - name: Drugstore
    items:
      - { name: Apples, quantity: "1 kg", store: "Farmers' market", category: Obst & Gemüse, by: anna, at: "-3h" }
      - { name: Tomatoes, quantity: "500 g", store: "Farmers' market", category: Obst & Gemüse, by: jonas, at: "-3h" }
      - { name: Lamb's lettuce, store: "Farmers' market", category: Obst & Gemüse, by: anna, at: "-170m" }
      - { name: Bread rolls, quantity: "6", store: Bakery, category: Brot & Backwaren, by: jonas, at: "-160m" }
      - { name: Sourdough bread, store: Bakery, category: Brot & Backwaren, by: anna, at: "-150m" }
      - { name: Milk, quantity: "2", store: Supermarket, category: Kühlregal, by: anna, at: "-140m" }
      - { name: Butter, store: Supermarket, category: Kühlregal, by: jonas, at: "-130m" }
      - { name: Yogurt, quantity: "4", store: Supermarket, category: Kühlregal, by: anna, at: "-120m" }
      - { name: Pasta, store: Supermarket, category: Vorrat & Konserven, by: jonas, at: "-110m" }
      - { name: Coffee, store: Supermarket, category: Vorrat & Konserven, by: anna, at: "-100m" }
      - { name: Sparkling water, quantity: "6", store: Supermarket, category: Getränke, by: jonas, at: "-90m" }
      - { name: Toothpaste, store: Drugstore, category: Haushalt, by: anna, at: "-80m" }
      - { name: Dish soap, store: Drugstore, category: Haushalt, by: jonas, at: "-70m" }
    history:
      # The weekly shop; the last one 9 days ago, so these are due again (gap 7 days).
      - at: "-9d 17:30"
        by: anna
        store: Supermarket
        every: 7d
        times: 8
        items: [Oat milk, Bananas, Cheese, Oats]
      # Saturday market, two days ago: usuals, not due yet.
      - at: "-2d 10:00"
        by: jonas
        store: "Farmers' market"
        every: 7d
        times: 8
        items: [Cucumbers, Carrots]
      # Bought once, five weeks ago: item→store memory sends the demo videos' adds to the
      # Supermarket, mid-list where the camera is; too old for the recently used rows, never due.
      - at: "-35d 18:00"
        by: anna
        store: Supermarket
        items: [Honey, Jam, Eggs]
expect:
  due:
    home: [Oat milk, Bananas, Cheese, Oats]
  notDue:
    home: [Cucumbers, Carrots]
