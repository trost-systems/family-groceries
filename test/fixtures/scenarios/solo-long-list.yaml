      # Süßes & Snacks
      - Schokolade
      - Chips
      - Gummibärchen
      - Kekse
      # Getränke
      - { name: Mineralwasser, quantity: "2 Kisten", store: Edeka }
      - Apfelsaft
      - Orangensaft
      - Bier
      - Kaffee
      - Tee
      # Tiefkühl
      - Tiefkühlpizza
      - Erbsen
