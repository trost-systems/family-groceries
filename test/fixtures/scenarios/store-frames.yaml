# yaml-language-server: $schema=../scenario.schema.json
name: store-frames
summary: The fictional household „Unser Haushalt“ with Anna and Jonas (as on the landing hero), its list in four generic stores, for the store-screenshot frame captures (job 214); no retailer appears on screen (Legal N-23).
goodFor:
  - store screenshots and their frames (design/store-frames/capture.mjs)
  - a list grouped by store with category headings
  - suggestions from past trips (Joghurt)
users:
  - { handle: anna, name: Anna }
  - { handle: jonas, name: Jonas }
households:
  - name: Unser Haushalt
    members: [anna, jonas]
    stores:
      - name: Wochenmarkt
        layout: [Obst & Gemüse, Brot & Backwaren]
      - name: Bäckerei
        layout: [Brot & Backwaren]
      - name: Supermarkt
        layout: [Obst & Gemüse, Kühlregal, Brot & Backwaren, Vorrat & Konserven, Getränke, Haushalt]
      - name: Drogerie
        layout: [👶 Drogerie, Haushalt]
    history:
      - at: -3d
        by: jonas
        store: Supermarkt
        every: 7d
        times: 4
        items: [{ name: Joghurt, quantity: "3" }, Haferflocken, Kaffee]
    items:
      - { name: Gurken, quantity: "2", store: Wochenmarkt, by: anna, at: -2h }
      - { name: Tomaten, store: Wochenmarkt, by: anna, at: -2h }
      - { name: Brötchen, quantity: "4", store: Bäckerei, by: anna, at: -2h }
      - { name: Milch, quantity: "2 l", properties: "1,5 %", store: Supermarkt, by: anna, at: -2h }
      - { name: Nudeln, store: Supermarkt, by: anna, at: -2h }
      - { name: Apfelsaft, store: Supermarkt, by: anna, at: -2h }
      - { name: Spülmittel, store: Supermarkt, by: anna, at: -2h }
      - { name: Zahnpasta, store: Drogerie, by: anna, at: -2h }
