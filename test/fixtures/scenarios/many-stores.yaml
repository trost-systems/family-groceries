# yaml-language-server: $schema=../scenario.schema.json
name: many-stores
summary: A household with nine stores, each with its own walk order and hidden categories, and items tagged to every store.
goodFor:
  - the store picker with many chips (overflow, scrolling)
  - store views ordered by distinct walk orders, hidden categories
  - the store layout editor
  - item→store memory across many stores
users:
  - { handle: tara, name: Tara Kaufmann }
  - { handle: uwe, name: Uwe Kaufmann }
households:
  - name: Familie Kaufmann
    members: [tara, uwe]
    categories:
      add: [Tiernahrung]
    stores:
      - name: Rewe
        layout: [Obst & Gemüse, Kühlregal, Brot & Backwaren, Fleisch/Wurst/Fisch, Vorrat & Konserven, Getränke, Tiefkühl, Haushalt]
      - name: Aldi Süd
        layout: [Brot & Backwaren, Obst & Gemüse, Vorrat & Konserven, Süßes & Snacks, Kühlregal, Tiefkühl, Getränke, Haushalt]
      - name: Kaufland
        layout: [Getränke, Haushalt, 👶 Drogerie, Tiernahrung, Vorrat & Konserven, Süßes & Snacks, Obst & Gemüse, Kühlregal, Fleisch/Wurst/Fisch, Tiefkühl]
      - name: Netto
        layout: [Obst & Gemüse, Brot & Backwaren, Tiefkühl, Kühlregal, Getränke]
      - name: Rossmann
        layout: [👶 Drogerie, Haushalt, Süßes & Snacks, Getränke]
        hidden: [Obst & Gemüse, Brot & Backwaren, Kühlregal, Fleisch/Wurst/Fisch, Tiefkühl, Tiernahrung]
      - name: Wochenmarkt
        layout: [Obst & Gemüse, Brot & Backwaren, Fleisch/Wurst/Fisch, Kühlregal]
        hidden: [Haushalt, 👶 Drogerie, Tiefkühl, Getränke, Süßes & Snacks, Tiernahrung]
      - name: Fressnapf
        layout: [Tiernahrung]
        hidden: [Obst & Gemüse, Brot & Backwaren, Kühlregal, Fleisch/Wurst/Fisch, Vorrat & Konserven, Süßes & Snacks, Getränke, Tiefkühl, 👶 Drogerie]
    items:
      - { name: Erdbeeren, store: Wochenmarkt }
      - { name: Bauernbrot, store: Wochenmarkt }
      - { name: Ziegenkäse, store: Wochenmarkt }
      - { name: Hundefutter, store: Fressnapf, category: Tiernahrung }
      - { name: Katzenstreu, store: Fressnapf, category: Tiernahrung }
      - { name: Windeln, store: Rossmann }
      - { name: Sonnencreme, store: Rossmann }
      - { name: Haarspray, store: Rossmann }
      - { name: Mineralwasser, quantity: "3 Kisten", store: Kaufland }
      - { name: Waschmittel, store: Kaufland }
      - { name: Katzenfutter, store: Kaufland, category: Tiernahrung }
      - { name: Fischstäbchen, store: Netto }
      - { name: Toast, store: Netto }
      - { name: Nüsse, store: Aldi Süd }
      - { name: Müsli, store: Aldi Süd }
      - { name: Lachs, store: Rewe }
      - { name: Rucola, store: Rewe }
      - { name: Pesto, store: Rewe }
      - { name: Milch, store: Lidl }
      - { name: Brot, store: Edeka }
      - { name: Zahnpasta, store: dm }
      - Zwiebeln
      - Kaffee
      - Spülmittel
