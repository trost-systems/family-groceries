# yaml-language-server: $schema=../scenario.schema.json
name: many-stores
summary: A household with ten stores, each with its own walk order and hidden categories, and items tagged to every store.
goodFor:
  - the store picker with many chips (overflow, scrolling)
  - store sections ordered by distinct walk orders
  - the store layout editor
  - item→store memory across many stores
users:
  - { handle: tara, name: Tara Kaufmann }
  - { handle: uwe, name: Uwe Kaufmann }
households:
  - name: Familie Kaufmann
    members: [tara, uwe]
    categories:
      add: [Tiernahrung]
    stores:
      - name: Supermarkt
        layout: [Obst & Gemüse, Kühlregal, Brot & Backwaren, Fleisch/Wurst/Fisch, Vorrat & Konserven, Getränke, Tiefkühl, Haushalt]
      - name: Discounter
        layout: [Brot & Backwaren, Obst & Gemüse, Vorrat & Konserven, Süßes & Snacks, Kühlregal, Tiefkühl, Getränke, Haushalt]
      - name: Großmarkt
        layout: [Getränke, Haushalt, 👶 Drogerie, Tiernahrung, Vorrat & Konserven, Süßes & Snacks, Obst & Gemüse, Kühlregal, Fleisch/Wurst/Fisch, Tiefkühl]
      - name: Biomarkt
        layout: [Obst & Gemüse, Brot & Backwaren, Tiefkühl, Kühlregal, Getränke]
      - name: Drogerie
        layout: [👶 Drogerie, Haushalt, Süßes & Snacks, Getränke]
        hidden: [Obst & Gemüse, Brot & Backwaren, Kühlregal, Fleisch/Wurst/Fisch, Tiefkühl, Tiernahrung]
      - name: Wochenmarkt
        layout: [Obst & Gemüse, Brot & Backwaren, Fleisch/Wurst/Fisch, Kühlregal]
        hidden: [Haushalt, 👶 Drogerie, Tiefkühl, Getränke, Süßes & Snacks, Tiernahrung]
      - name: Tierbedarf
        layout: [Tiernahrung]
        hidden: [Obst & Gemüse, Brot & Backwaren, Kühlregal, Fleisch/Wurst/Fisch, Vorrat & Konserven, Süßes & Snacks, Getränke, Tiefkühl, 👶 Drogerie]
      - name: Hofladen
        layout: [Kühlregal, Obst & Gemüse, Fleisch/Wurst/Fisch, Brot & Backwaren]
        hidden: [Haushalt, 👶 Drogerie, Tiefkühl, Tiernahrung]
      - name: Bäckerei
        layout: [Brot & Backwaren, Süßes & Snacks, Getränke]
        hidden: [Obst & Gemüse, Kühlregal, Fleisch/Wurst/Fisch, Tiefkühl, Haushalt, 👶 Drogerie, Tiernahrung]
      - name: Apotheke
        layout: [👶 Drogerie]
        hidden: [Obst & Gemüse, Brot & Backwaren, Kühlregal, Fleisch/Wurst/Fisch, Tiefkühl, Getränke, Tiernahrung]
    items:
      - { name: Erdbeeren, store: Wochenmarkt }
      - { name: Bauernbrot, store: Wochenmarkt }
      - { name: Ziegenkäse, store: Wochenmarkt }
      - { name: Hundefutter, store: Tierbedarf, category: Tiernahrung }
      - { name: Katzenstreu, store: Tierbedarf, category: Tiernahrung }
      - { name: Windeln, store: Drogerie }
      - { name: Sonnencreme, store: Drogerie }
      - { name: Haarspray, store: Drogerie }
      - { name: Mineralwasser, quantity: "3 Kisten", store: Großmarkt }
      - { name: Waschmittel, store: Großmarkt }
      - { name: Katzenfutter, store: Großmarkt, category: Tiernahrung }
      - { name: Fischstäbchen, store: Biomarkt }
      - { name: Toast, store: Biomarkt }
      - { name: Nüsse, store: Discounter }
      - { name: Müsli, store: Discounter }
      - { name: Lachs, store: Supermarkt }
      - { name: Rucola, store: Supermarkt }
      - { name: Pesto, store: Supermarkt }
      - { name: Milch, store: Hofladen }
      - { name: Brot, store: Bäckerei }
      - { name: Zahnpasta, store: Apotheke }
      - Zwiebeln
      - Kaffee
      - Spülmittel
