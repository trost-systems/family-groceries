# yaml-language-server: $schema=../scenario.schema.json
name: heavy-history
summary: Two members with eight weeks of shopping trips at Edeka, Lidl and dm, so suggestions show clear usuals and several items are due again.
goodFor:
  - usuals and "Brauchen wir wieder?" (suggest_items, due items)
  - prefix suggestions in the add field
  - the recently used history and quick re-add
  - performance of the list with a long history
users:
  - { handle: jo, name: Jo Weber }
  - { handle: kai, name: Kai Weber }
households:
  - name: Wohnung Weber
    members: [jo, kai]
    items:
      - Kaffee
      - { name: Spülmaschinentabs, store: dm }
      - Basilikum
    history:
      # Weekly big shop; last one 9 days ago, so these are due (gap 7 days).
      - at: "-9d 17:30"
        by: jo
        store: Edeka
        every: 7d
        times: 8
        items: [Milch, Brot, Eier, Butter, Bananen, Äpfel, Käse, Joghurt]
      # Weekly top-up two days ago: usuals, not due yet.
      - at: "-2d 18:10"
        by: kai
        store: Lidl
        every: 7d
        times: 8
        items: [Hafermilch, Gurken, Tomaten, Nudeln]
      # Every two weeks at dm; last one 20 days ago, so due (gap 14 days).
      - at: "-20d 10:00"
        by: kai
        store: dm
        every: 14d
        times: 4
        items: [Windeln, Zahnpasta, Duschgel]
      # Bought once: in the history, never due.
      - at: "-30d 12:00"
        by: jo
        items: [Grillkohle, Sekt]
expect:
  usuals:
    home: [Milch, Brot, Hafermilch, Nudeln, Windeln, Zahnpasta]
  due:
    home: [Milch, Brot, Eier, Windeln, Duschgel]
  notDue:
    home: [Hafermilch, Gurken, Tomaten, Nudeln, Grillkohle]
